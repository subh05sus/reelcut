      <style>
        /* A PRODUCT SURFACE IN A FRAME. For a beat that shows a real screen: the surface rises in,
           the camera pushes slowly toward the part the sentence is about, a focus ring draws around
           it while everything else steps back, and one short label names it.

           The frame is deliberately minimal — a dark bezel and a radius, no traffic lights, no URL
           bar, no notch. Drawn chrome dates a video and competes with the screen it holds.

           THE SLOT: .screen holds a drawn placeholder so this renders on its own. Every flat area in it
           carries marks down its whole length — a sidebar with four items and 380px of nothing under
           them is exactly what the blank-panel check fails, and it is right to. With a capture,
           replace the placeholder children with
             <img src="assets/capture.png" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
           and move the focus ring's rect onto the region that matters. A capture only goes in here
           if it passed the legibility gate at this width (908px of 1080, target 0.84).

           Fixed geometry: device 936×585 at 72,290; screen inset 14px, so 908×557. The focus ring
           is in screen coordinates; the push-in origin is the ring's centre in device coordinates. */
        #root { position: absolute; inset: 0; background: #ede9e3; color: #14110e;
                font-family: Inter, Arial, Helvetica, sans-serif; overflow: hidden; }
        #root .line { position: absolute; left: 72px; top: 92px; width: 936px;
                      font-size: 52px; font-weight: 700; line-height: 1.16; letter-spacing: -0.024em; }
        #root .line .accent { color: #d02d1c; }
        #root .device { position: absolute; left: 72px; top: 290px; width: 936px; height: 585px;
                        border-radius: 24px; background: #14110e; }
        #root .screen { position: absolute; left: 14px; top: 14px; width: 908px; height: 557px;
                        border-radius: 12px; background: #faf8f4; overflow: hidden; }
        #root .screen i { position: absolute; display: block; border-radius: 7px; }
        #root .side { left: 0; top: 0; width: 190px; height: 557px; background: #e6e1d9; border-radius: 0 !important; }
        #root .card { width: 200px; height: 150px; background: #efebe4; border: 2px solid #ddd6cc; border-radius: 12px !important; }
        #root .ink { background: #cfc8bd; height: 14px; }
        #root .head { background: #3b352f; height: 26px; }
        #root .ring { position: absolute; left: 14px; top: 14px; width: 908px; height: 557px; overflow: visible; }
        #root .callout { position: absolute; left: 72px; top: 912px; width: 936px; display: flex; align-items: center; gap: 18px;
                         font-size: 40px; font-weight: 700; letter-spacing: -0.015em; }
        #root .callout .dot { width: 18px; height: 18px; border-radius: 50%; background: #d02d1c; flex: none; }
      </style>

          <svg class="ring" viewBox="0 0 908 557">

      <script>
        (function () {
          // Ring perimeter from its fixed size, once: 2(w+h) minus the corner savings of rx.
          var ring = document.querySelector("#root [data-ring]");
          var w = 224, h = 174, r = 18;
          var perimeter = 2 * (w + h) - 8 * r + 2 * Math.PI * r;
          ring.setAttribute("stroke-dasharray", perimeter + " " + perimeter);
          ring.setAttribute("stroke-dashoffset", String(perimeter));

          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#root .line", { y: 14, opacity: 0.55 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
          tl.fromTo("#root .device", { y: 40, scale: 0.96, opacity: 0, transformOrigin: "564px 189px" }, { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.14);
          // The slow push toward the focus region runs under everything else — a camera, not an
          // event. Origin = ring centre in device coordinates (14 + 550, 14 + 175).
          // A .to, not a second fromTo: two fromTos on one property fight over the frame-0 state.
          tl.to("#root .device", { scale: 1.035, duration: 3.6, ease: "power1.inOut" }, 0.66);
          tl.to("#root [data-ring]", { attr: { "stroke-dashoffset": 0 }, duration: 0.55, ease: "power2.inOut" }, 1.2);
          tl.to("#root [data-dim]", { opacity: 0.4, duration: 0.4, ease: "power1.out" }, 1.3);
          tl.fromTo("#root .callout", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 1.6);
          window.__timelines["device-surface"] = tl;
        })();
      </script>

<!doctype html>
<!-- archetype seconds=4.0 -->
<html lang="de">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* A COUNTER THAT RESOLVES. For a beat whose point is one number. Each digit is a strip of
           0–9 twice over, masked to one cell and rolled with translateY to its target, so the
           figure is exact on every frame the renderer seeks to — no text is rewritten per frame and
           nothing depends on playback order.

           THE NUMBER MUST COME FROM AN APPROVED DATUM, and the source line under it is not
           decoration: it is printed on the frame so the claim carries its evidence. The value below
           is a placeholder — replace the digits AND the source together, or do not use this.

           To set a value: one .digit per numeral, with data-to="<0-9>". Separators are plain
           .sep spans and do not roll. Cell height is fixed at 230px so the roll distance is
           arithmetic, never measured. */
        #root { position: absolute; inset: 0; background: #ede9e3; color: #14110e;
                font-family: Inter, Arial, Helvetica, sans-serif; overflow: hidden; }
        #root .label { position: absolute; left: 72px; top: 250px; width: 936px;
                       font-size: 48px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; }
        #root .figure { position: absolute; left: 72px; top: 360px; height: 230px; display: flex;
                        font-size: 240px; font-weight: 800; letter-spacing: -0.04em; line-height: 230px;
                        font-variant-numeric: tabular-nums; color: #d02d1c; }
        #root .digit { width: 150px; height: 230px; overflow: hidden; }
        #root .strip { display: flex; flex-direction: column; }
        #root .strip span { height: 230px; text-align: center; }
        #root .sep { width: 64px; text-align: center; }
        #root .claim { position: absolute; left: 72px; top: 640px; width: 936px;
                       font-size: 48px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; }
        #root .rule { position: absolute; left: 72px; top: 790px; width: 936px; height: 6px;
                      background: #14110e; transform-origin: 0% 50%; }
        #root .source { position: absolute; left: 72px; top: 830px; width: 936px;
                        font-size: 26px; font-weight: 500; line-height: 1.3; color: #5f5850; }
      </style>

      <div id="root" data-composition-id="counter-resolves" data-width="1080" data-height="1080">
        <div class="label">Jede Woche arbeiten damit</div>
        <div class="figure">
          <div class="digit" data-to="1"><div class="strip"></div></div>
          <span class="sep">.</span>
          <div class="digit" data-to="2"><div class="strip"></div></div>
          <div class="digit" data-to="4"><div class="strip"></div></div>
          <div class="digit" data-to="0"><div class="strip"></div></div>
        </div>
        <div class="claim">Teams — ohne ein einziges Meeting dazu.</div>
        <div class="rule"></div>
        <div class="source">Quelle: Beispielwert, vor Gebrauch durch ein freigegebenes Datum ersetzen</div>
      </div>

      <script>
        (function () {
          var CELL = 230;
          // Build every strip once at setup: 0–9 twice, so each digit rolls one full turn past
          // before it lands, and the target cell is always 10 + d.
          document.querySelectorAll("#root .strip").forEach(function (strip) {
            for (var i = 0; i < 20; i++) {
              var cell = document.createElement("span");
              cell.textContent = String(i % 10);
              strip.appendChild(cell);
            }
          });

          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#root .label", { y: 14, opacity: 0.55 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
          // Digits land left to right, so the eye reads the magnitude before the last digit settles.
          document.querySelectorAll("#root .digit").forEach(function (digit, i) {
            var to = Number(digit.getAttribute("data-to"));
            tl.fromTo(digit.querySelector(".strip"), { y: 0 }, { y: -(10 + to) * CELL, duration: 1.2, ease: "power3.out" }, 0.18 + i * 0.1);
          });
          tl.fromTo("#root .claim", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 1.1);
          // The rule draws once the figure has resolved; the source is on the frame before the
          // number stops moving, never after.
          tl.fromTo("#root .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 1.6);
          tl.fromTo("#root .source", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 1.3);
          window.__timelines["counter-resolves"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

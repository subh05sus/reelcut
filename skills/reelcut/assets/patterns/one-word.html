<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /></head><body>
<template>
<style>
  /* ONE WORD. One word owns the frame, then is replaced by the next like a slot reel:
     "Faster. Better. Stronger." A bloom breathes behind it. For a beat that is a list of
     adjectives, a claim in three hits, a rhythm. */
  #root .kicker { position: absolute; left: 0; right: 0; top: 330px; text-align: center; }
  #root .word { position: absolute; left: 0; right: 0; top: 400px; text-align: center; font-size: 250px; line-height: 1; }
  #root .rc-bloom { width: 1100px; height: 1100px; margin: -550px 0 0 -550px; }
</style>
<div id="root" data-look="ink" data-composition-id="one-word" data-width="1080" data-height="1080">
  <div class="rc-bloom"></div>
  <div class="kicker rc-kicker">Lumen 2.0</div>
  <div class="word rc-display"><span class="r">Faster.</span></div>
  <div class="rc-grain"></div>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  RC.blurIn(tl, "#root .kicker", 0.0, { lead: true, blur: 8, y: 8 });
  tl.fromTo("#root .word", { opacity: 0.55, scale: 0.9, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0);
  RC.roll(tl, "#root .word .r", 1.25, { values: ["Faster.", "Better.", "Stronger."], each: 0.95, duration: 0.42 });
  tl.fromTo("#root .rc-bloom", { scale: 0.7, opacity: 0.5 }, { scale: 1.1, opacity: 1, duration: 1.2, ease: "sine.inOut" }, 0)
    .to("#root .rc-bloom", { scale: 0.85, duration: 1.0, ease: "sine.inOut" }, 1.2)
    .to("#root .rc-bloom", { scale: 1.15, duration: 1.2, ease: "sine.inOut" }, 2.2);
  RC.hold(tl, 3.45);
  window.__timelines["one-word"] = tl;
})();
</script>
</template>
</body></html>

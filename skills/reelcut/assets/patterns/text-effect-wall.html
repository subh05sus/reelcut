<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /></head><body>
<template>
<style>
  /* TEXT-EFFECT WALL. Six cells in a hairline grid, each one word and each one a different way for a
     word to arrive — resolve out of blur, roll through values, decode out of noise, rise out of a mask,
     close in from a spread, type with a caret — every one starting on its own beat, so the wall fills
     like a score rather than all at once. A calm hero for anything that is about type, motion or
     craft: nothing here competes with the words, and each cell names its effect in mono at its foot.
     Warm paper, ink, one ember accent used only for what is live in a cell (a caret, the rolling
     value, the decoded word).
     Grid: the wall is on the 84px margins (84 to 996) and fills the content region (336 to 996):
     three columns of 304, two rows of 330, a 1.5px hairline between, 28px of inset inside each cell,
     the word centred at 140 and the label on a 24px foot. The camera push carries the headline. */
  #root { --accent: #c2410c; }
  #root .cam { position: absolute; inset: 0; transform-origin: 540px 540px; }
  #root .wall { position: absolute; left: 84px; top: 336px; width: 912px; height: 660px; border-radius: 28px; box-shadow: inset 0 0 0 1.5px rgba(18,18,18,.2); }
  #root .vl { position: absolute; top: 0; width: 1.5px; height: 660px; background: rgba(18,18,18,.2); }
  #root .hl2 { position: absolute; left: 0; top: 329px; width: 912px; height: 1.5px; background: rgba(18,18,18,.2); }
  #root .cell { position: absolute; width: 304px; height: 330px; }
  #root .c1 { left: 0; top: 0; } #root .c2 { left: 304px; top: 0; } #root .c3 { left: 608px; top: 0; }
  #root .c4 { left: 0; top: 330px; } #root .c5 { left: 304px; top: 330px; } #root .c6 { left: 608px; top: 330px; }
  #root .cell .w { position: absolute; left: 0; width: 304px; top: 100px; height: 80px; text-align: center; font-size: 66px; line-height: 80px; white-space: nowrap; }
  #root .cell .lb { position: absolute; left: 28px; bottom: 24px; font: 500 18px/22px var(--font-mono); letter-spacing: .14em; color: #5a564e; }
  #root .c1 .w { font-weight: 700; letter-spacing: -0.04em; }
  #root .c2 .w { font-family: var(--font-serif); font-style: italic; font-size: 76px; }
  #root .c3 .w { font-family: var(--font-mono); font-weight: 500; font-size: 52px; letter-spacing: -0.04em; color: var(--accent); }
  #root .c4 .w { font-weight: 650; letter-spacing: -0.04em; overflow: hidden; }
  #root .c5 .w { font-family: var(--font-serif); font-size: 80px; }
  #root .c6 .w { font-family: var(--font-mono); font-weight: 500; font-size: 52px; letter-spacing: -0.04em; }
  #root .c6 .w .rc-caret { height: 56px; margin-left: 2px; vertical-align: -9px; }
</style>
<div id="root" data-look="paper" data-composition-id="text-effect-wall" data-width="1080" data-height="1080">
  <div class="rc-mesh" style="--mesh-1: rgba(226,86,42,.17); --mesh-2: rgba(18,18,18,.06)"></div>
  <div class="rc-dots" style="opacity:.5"></div>
  <div class="cam">
    <div class="rc-head"><span class="ln" style="--ox:-1.4px">Type that</span><span class="ln" style="--ox:-1.6px"><em class="rc">moves.</em></span></div>
    <div class="wall">
      <span class="vl" style="left:304px"></span><span class="vl" style="left:608px"></span><span class="hl2"></span>
      <div class="cell c1"><div class="w">Resolve</div><div class="lb">BLUR</div></div>
      <div class="cell c2"><div class="w"><span class="rv">Design</span></div><div class="lb">ROLL</div></div>
      <div class="cell c3"><div class="w">Decode</div><div class="lb">DECODE</div></div>
      <div class="cell c4"><div class="w"><span class="rc-line"><span class="rc-in">Rise</span></span></div><div class="lb">MASK</div></div>
      <div class="cell c5"><div class="w">Gather</div><div class="lb">SPREAD</div></div>
      <div class="cell c6"><div class="w"><span class="tx">Typed.</span><span class="rc-caret"></span></div><div class="lb">TYPE</div></div>
    </div>
  </div>
  <div class="rc-grain"></div>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  RC.words(tl, "#root .rc-head", 0, { lead: true, stagger: 0.09, blur: 14, y: 20 });
  // The wall's own frame (hairlines and labels) is there at frame 0; the words are what arrive.
  tl.fromTo("#root .wall", { y: 36, opacity: 0.8 }, { y: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, 0.05);
  // 1 — blur: each letter resolves out of soft focus. Already legible, a little soft, at frame 0.
  RC.chars(tl, "#root .c1 .w", 0.15, { lead: true, stagger: 0.05, blur: 12, y: 16, duration: 0.75 });
  // 2 — roll: a value cell cycles through three words.
  tl.fromTo("#root .c2 .w", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 0.55);
  RC.roll(tl, "#root .c2 .rv", 1.5, { values: ["Design", "Build", "Ship"], each: 0.8, duration: 0.45 });
  // 3 — decode: noise resolves into the word, left to right, in the accent.
  tl.fromTo("#root .c3 .w", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.95);
  RC.scramble(tl, "#root .c3 .w", 0.95, { duration: 0.9, seed: 31, tail: 3 });
  // 4 — mask: the word rises out of its own line.
  RC.lines(tl, "#root .c4 .w", 1.35, { duration: 0.8 });
  // 5 — spread: letters close in from a wide tracking, out of blur.
  const g = RC.split("#root .c5 .w", "chars"), mid = (g.length - 1) / 2;
  g.forEach((c, i) => {
    tl.fromTo(c, { x: (i - mid) * 44, opacity: 0 }, { x: 0, opacity: 1, duration: 1.0, ease: "expo.out" }, 1.75);
    tl.fromTo(c, { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, 1.75);
  });
  // 6 — type: the word is typed, the caret solid while keys land and blinking after.
  RC.type(tl, "#root .c6 .tx", 2.2, { text: "Typed.", cps: 7 });
  // labels arrive with their cells
  [".c1", ".c2", ".c3", ".c4", ".c5", ".c6"].forEach((c, i) => {
    tl.fromTo("#root " + c + " .lb", { opacity: 0.45 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.3 + i * 0.4);
  });
  RC.camera(tl, "#root .cam", 0, { duration: 5, to: { scale: 1.03 } });
  RC.drift(tl, "#root .rc-mesh", 0, { duration: 5, x: 50, y: -30, scale: 1.08 });
  RC.hold(tl, 4.95);
  window.__timelines["text-effect-wall"] = tl;
})();
</script>
</template>
</body></html>

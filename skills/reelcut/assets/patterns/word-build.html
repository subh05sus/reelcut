<template>
<style>
  /* WORD BUILD. A sentence assembles in place, centred, one word at a time, and the word that
     carries the meaning arrives last in italic serif. The move from 0xdesigner, launchvideo.dev,
     Ramp: the frame is almost empty, so the sentence is the event. */
  #root { --accent: #e2562a; }
  #root .stage { position: absolute; inset: 0; }
  #root .h { position: absolute; left: 90px; right: 90px; top: 380px; text-align: center;

  #root .h em { font-size: 1.14em; color: var(--accent); position: relative; }
  #root .u { position: absolute; left: 4%; right: 2%; bottom: .02em; height: .045em; background: var(--accent); border-radius: 1em; transform-origin: 0 50%; }
  #root .sub { position: absolute; left: 0; right: 0; top: 660px; text-align: center; font-size: 30px; color: var(--muted); letter-spacing: -0.01em; }
</style>
<div id="root" data-look="paper" data-composition-id="word-build" data-width="1080" data-height="1080">
  <div class="rc-mesh" style="--mesh-1: rgba(226,86,42,.16); --mesh-2: rgba(47,91,255,.08)"></div>

    <div class="h">The first launch film<br />that writes <em class="rc">itself.<span class="u"></span></em></div>

  </div>
  <div class="rc-grain"></div>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  RC.words(tl, "#root .h", 0.0, { lead: true, stagger: 0.085, blur: 16, y: 26 });

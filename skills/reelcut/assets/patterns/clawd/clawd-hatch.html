<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /></head><body>
<template>
<style>
  /* CLAWD HATCH. Something new: a pixel egg wobbles harder, cracks three times, the shell flies off and Clawd pops out
     with sparkles, then puts on a party hat. For a launch, a new skill, a new feature. */
  #root .cam { position: absolute; inset: 0; }
  #root .ground { position: absolute; left: 84px; right: 84px; top: 920px; height: 4px; border-radius: 2px; background: var(--ink); opacity: .1; }
</style>
<div id="root" data-look="paper" data-composition-id="clawd-hatch" data-width="1080" data-height="1080">
  <div class="rc-mesh" style="--m1x: 80%; --m1y: 72%; --m2x: 18%; --m2y: 96%; --mesh-2: rgba(255,210,63,.16)"></div>
  <div class="cam">
    <div class="rc-head"><span class="ln" style="--ox:-3px">Something</span><span class="ln"><em class="rc">new.</em></span></div>
    <div class="ground"></div>
  </div>
  <div class="rc-grain"></div>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  RC.words(tl, "#root .rc-head", 0, { lead: true, stagger: 0.1 });
  const c = RC.clawd("#root .cam", { x: 540, y: 920, size: 300 });
  RC.clawd.hatch(tl, c, 0.2);
  RC.clawd.dress(tl, c, c.free + 0.1, "party-hat");
  RC.clawd.life(tl, c, 0, 4.6);
  RC.camera(tl, "#root .cam", 0, { duration: 4.6 });
  RC.hold(tl, 4.6);
  window.__timelines["clawd-hatch"] = tl;
})();
</script>
</template>
</body></html>

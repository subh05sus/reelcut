<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /></head><body>
<template>
<style>
  /* CLAWD SUBAGENTS. Parallel work: mini Clawds pop out of Clawd, hop to a fan of spots, each thinks under Claude
     Code's spinner, gets a check when it is done, and hops back in. RC.clawd.minis returns the minis, so the beat can
     time a check over each. Ink look: the orange reads warm on the dark ground. */
  #root .cam { position: absolute; inset: 0; }
  #root .ground { position: absolute; left: 84px; right: 84px; top: 940px; height: 3px; border-radius: 2px; background: var(--ink); opacity: .14; }
</style>
<div id="root" data-look="ink" data-composition-id="clawd-subagents" data-width="1080" data-height="1080">
  <div class="rc-bloom"></div>
  <div class="cam">
    <div class="rc-head"><span class="ln" style="--ox:-3px">Four agents,</span><span class="ln"><em class="rc">at once.</em></span></div>
    <div class="ground"></div>
  </div>
  <div class="rc-grain"></div>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  RC.words(tl, "#root .rc-head", 0, { lead: true, stagger: 0.09 });
  const c = RC.clawd("#root .cam", { x: 540, y: 940, size: 260 });
  RC.clawd.enter(tl, c, 0, { from: "pop" });
  const minis = RC.clawd.minis(tl, c, 0.4, { n: 4, work: 1.3, spread: 420 });
  minis.forEach(function (m) { RC.clawd.done(tl, m, m.marks.worked - 0.2, { dur: 0.5 }); });
  RC.clawd.life(tl, c, 0, 5.2);
  RC.hold(tl, 5.2);
  window.__timelines["clawd-subagents"] = tl;
})();
</script>
</template>
</body></html>

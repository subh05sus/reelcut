<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /></head><body>
<template>
<style>
  /* LINE CHART SCRUB. The range control glides from 1M to 1Y on a glass lens and the line draws
     itself across a quiet grid; then a cursor takes the end of the line and scrubs back along it —
     a dot rides the curve, a tooltip names the month, the headline figure counts to whatever the dot
     is on — and settles part-way forward again. Cause, then effect, then the number you came for.
     Everything that moves with the cursor is computed from one clock, so it seeks exactly.
     Grid: the card is on the 84px margins (84 to 996), 660 tall from the content top (336). Header
     96 (label, figure, control), plot 768 by 360 starting at x 108 and y 220 with five rules 90 apart,
     twelve months 69.8 apart. The cursor lives in the camera layer, so it stays on the line. */
  #root { --accent: #2f5bff; }
  #root .cam { position: absolute; inset: 0; transform-origin: 540px 540px; }
  #root .ch { left: 84px; top: 336px; width: 912px; height: 660px; border-radius: 36px; }
  #root .lbl { position: absolute; left: 36px; top: 36px; font: 500 20px/24px var(--font-mono); letter-spacing: .14em; color: var(--card-muted); }
  #root .kpi { position: absolute; left: 36px; top: 66px; height: 80px; display: flex; align-items: center; gap: 20px; }
  #root .kpi .num { font-size: 76px; line-height: 80px; font-weight: 700; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; }
  #root .kpi .dl { height: 44px; padding: 0 18px; border-radius: 22px; display: flex; align-items: center; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); background: color-mix(in oklab, var(--accent) 13%, transparent); }
  #root .rng { position: absolute; right: 36px; top: 36px; padding: 6px; border-radius: 34px; font-size: 24px; }
  #root .rng > span { width: 92px; padding: 10px 0; line-height: 36px; text-align: center; }
  #root .rng > .rc-thumb { width: 92px; }
  #root .rng > span.on { color: var(--ink); }
  #root .yl { position: absolute; left: 36px; width: 60px; font: 500 18px/22px var(--font-mono); color: var(--card-muted); }
  #root .xl { position: absolute; top: 596px; width: 60px; text-align: center; font: 500 18px/22px var(--font-mono); color: var(--card-muted); }
  #root svg.sv { position: absolute; left: 0; top: 0; width: 912px; height: 660px; overflow: visible; }
  #root svg.area { clip-path: inset(0 67% 0 0); }
  #root .tip { left: 0; top: 0; font-size: 24px; padding: 8px 18px; }
  #root .dot { position: absolute; left: 0; top: 0; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: #fff; border: 5px solid var(--accent); box-shadow: 0 6px 14px -4px rgba(47,91,255,.5); opacity: 0; }
</style>
<div id="root" data-look="cool" data-composition-id="line-chart-scrub" data-width="1080" data-height="1080">
  <div class="rc-mesh" style="--mesh-1: rgba(47,91,255,.2); --mesh-2: rgba(125,153,255,.22)"></div>
  <div class="rc-dots" style="opacity:.5"></div>
  <div class="cam">
    <div class="rc-head"><span class="ln" style="--ox:-4.3px">Numbers that</span><span class="ln" style="--ox:-3.2px"><em class="rc">tell the story.</em></span></div>
    <div class="rc-card ch">
      <div class="lbl">REVENUE</div>
      <div class="kpi"><div class="num">€48,210</div><div class="dl">+12.4%</div></div>
      <div class="rc-seg rng"><div class="rc-glass rc-clear rc-thumb"></div><span>1W</span><span class="on">1M</span><span>1Y</span></div>
      <svg class="sv grid" viewBox="0 0 912 660"><g class="rc-rule-line"></g></svg>
      <svg class="sv area" viewBox="0 0 912 660"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f5bff" stop-opacity=".24"/><stop offset="1" stop-color="#2f5bff" stop-opacity="0"/></linearGradient></defs><path class="ap" fill="url(#ag)"/></svg>
      <svg class="sv ln2" viewBox="0 0 912 660"><path class="lp" fill="none" stroke="#2f5bff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><line class="gd" stroke="#2f5bff" stroke-opacity=".45" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round" opacity="0"/></svg>
      <div class="dot"></div>
      <div class="rc-tip tip" style="opacity:0">Dec</div>
    </div>
  </div>
  <div class="rc-grain"></div>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  RC.glass();
  const NS = "http://www.w3.org/2000/svg", root = document.querySelector("#root");
  const card = root.querySelector(".ch"), cam = root.querySelector(".cam"), cur = RC.cursorEl(cam);
  // ---- the data and the plot ---------------------------------------------------------------
  const data = [22.4, 25.1, 24.0, 28.6, 31.2, 29.8, 36.2, 38.9, 37.5, 42.7, 45.9, 48.21];
  const mon = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const PX = 108, PW = 768, PY = 220, PH = 360, STEP = PW / 11;
  const yOf = (v) => PY + PH - (v / 60) * PH;
  const pts = data.map((v, i) => ({ x: PX + i * STEP, y: yOf(v) }));
  // monotone cubic: smooth, never overshoots a data point
  const n = pts.length, dx = [], m = [], tg = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1].x - pts[i].x; m[i] = (pts[i + 1].y - pts[i].y) / dx[i]; }
  tg[0] = m[0]; tg[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) tg[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) { tg[i] = tg[i + 1] = 0; continue; }
    const a = tg[i] / m[i], b = tg[i + 1] / m[i], h = Math.hypot(a, b);
    if (h > 3) { const k = 3 / h; tg[i] = k * a * m[i]; tg[i + 1] = k * b * m[i]; }
  }
  let d = "M " + pts[0].x + " " + pts[0].y; const poly = [];
  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[i], p1 = pts[i + 1], c1 = { x: p0.x + dx[i] / 3, y: p0.y + tg[i] * dx[i] / 3 }, c2 = { x: p1.x - dx[i] / 3, y: p1.y - tg[i + 1] * dx[i] / 3 };
    d += " C " + c1.x.toFixed(2) + " " + c1.y.toFixed(2) + ", " + c2.x.toFixed(2) + " " + c2.y.toFixed(2) + ", " + p1.x.toFixed(2) + " " + p1.y.toFixed(2);
    for (let k = 0; k <= 40; k++) {
      const t = k / 40, u = 1 - t;
      poly.push({ x: u * u * u * p0.x + 3 * u * u * t * c1.x + 3 * u * t * t * c2.x + t * t * t * p1.x, y: u * u * u * p0.y + 3 * u * u * t * c1.y + 3 * u * t * t * c2.y + t * t * t * p1.y });
    }
  }
  const lineY = (x) => { for (let i = 1; i < poly.length; i++) if (poly[i].x >= x) { const a = poly[i - 1], b = poly[i], f = b.x === a.x ? 0 : (x - a.x) / (b.x - a.x); return a.y + (b.y - a.y) * f; } return poly[poly.length - 1].y; };
  const lp = root.querySelector(".lp"), ap = root.querySelector(".ap");
  lp.setAttribute("d", d); ap.setAttribute("d", d + " L " + pts[n - 1].x + " " + (PY + PH) + " L " + pts[0].x + " " + (PY + PH) + " Z");
  // grid rules and axis labels
  const gg = root.querySelector(".grid .rc-rule-line");
  [0, 15, 30, 45, 60].forEach((v) => {
    const y = yOf(v), l = document.createElementNS(NS, "line");
    l.setAttribute("x1", PX); l.setAttribute("x2", PX + PW); l.setAttribute("y1", y); l.setAttribute("y2", y); l.setAttribute("stroke", "currentColor"); gg.appendChild(l);
    const t = document.createElement("div"); t.className = "yl"; t.style.top = (y - 11) + "px"; t.textContent = v === 0 ? "€0" : "€" + v + "k"; t.style.textAlign = "right"; t.style.left = "30px"; card.appendChild(t);
  });
  const xl = mon.map((s, i) => { const t = document.createElement("div"); t.className = "xl"; t.style.left = (pts[i].x - 30) + "px"; t.textContent = s; card.appendChild(t); return t; });
  gg.style.color = "rgba(15,20,32,.10)";
  // ---- entrances ---------------------------------------------------------------------------
  RC.words(tl, "#root .rc-head", 0, { lead: true, stagger: 0.09, blur: 14, y: 20 });
  tl.fromTo("#root .ch", { y: 50, opacity: 0.75 }, { y: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, 0.05);
  // The header is on screen at frame 0 (partly, in soft focus) and settles; the control is not blurred, because
  // glass inside a filtered parent would lose what is behind it.
  tl.fromTo("#root .lbl, #root .kpi", { opacity: 0.7, y: 12, filter: "blur(5px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out", stagger: 0.06 }, 0.1);
  tl.fromTo("#root .rng", { opacity: 0.7, y: 12 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 0.16);
  // The plot is there at frame 0 (rules and labels, a little faint); the line is what arrives.
  tl.fromTo("#root .yl, #root .xl", { opacity: 0.55, y: 8, filter: "blur(3px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out", stagger: 0.012 }, 0.2);
  tl.fromTo("#root .grid", { opacity: 0.5 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.2);
  // the control moves first; the chart answers it
  gsap.set("#root .rng .rc-thumb", { x: 92 });                       // it starts on 1M
  tl.to("#root .rng .rc-thumb", { x: 184, duration: 0.6, ease: "expo.inOut" }, 0.8);
  tl.to("#root .rng span:nth-of-type(2)", { color: "#586175", duration: 0.3 }, 0.9);
  tl.to("#root .rng span:nth-of-type(3)", { color: "#0f1420", duration: 0.3 }, 0.9);
  // The line has a head start, so frame 0 already holds a chart rather than an empty card: a third of it is
  // drawn, and the rest follows.
  const LEN = lp.getTotalLength(), HEAD = 0.33;
  lp.style.strokeDasharray = LEN; lp.style.strokeDashoffset = LEN * (1 - HEAD);
  tl.to(lp, { strokeDashoffset: 0, duration: 1.6, ease: "power2.inOut" }, 0.5);
  tl.fromTo("#root svg.area", { clipPath: "inset(0 " + (100 - HEAD * 100) + "% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.6, ease: "power2.inOut" }, 0.5);
  // ---- the scrub: one clock, everything computed from it -----------------------------------
  const num = root.querySelector(".kpi .num"), dot = root.querySelector(".dot"), tip = root.querySelector(".tip"), gd = root.querySelector(".gd");
  const eo = (t) => 1 - Math.pow(1 - t, 3), eio = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const clamp01 = (t) => Math.min(1, Math.max(0, t));
  const CX = 84, CY = 336;                                // the card's place in the frame
  const sOf = (T) => {
    if (T < 3.0) return 1;
    if (T < 4.3) return 1 - 0.5 * eio(clamp01((T - 3.0) / 1.3));
    if (T < 4.8) return 0.5;
    return 0.5 + 0.22 * eio(clamp01((T - 4.8) / 0.8));
  };
  const scene = (T) => {
    const s = sOf(T), x = PX + s * PW, y = lineY(x), idx = Math.round(s * 11), v = (PY + PH - y) / PH * 60;
    const vis = clamp01((T - 2.3) / 0.4);                  // the dot, the guide and the tip arrive with the cursor
    dot.style.opacity = vis; tip.style.opacity = vis; gd.setAttribute("opacity", vis);
    dot.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
    gd.setAttribute("x1", x); gd.setAttribute("x2", x); gd.setAttribute("y1", y + 14); gd.setAttribute("y2", PY + PH);
    tip.textContent = mon[idx];
    tip.style.transform = "translate(" + (x - tip.offsetWidth / 2).toFixed(1) + "px," + (y - 66).toFixed(1) + "px)";
    xl.forEach((e, i) => { e.style.color = i === idx && vis > 0.5 ? "#0f1420" : ""; e.style.fontWeight = i === idx && vis > 0.5 ? 700 : 500; });
    num.textContent = "€" + Math.round(v * 1000).toLocaleString("en-US");
    // the cursor: in from the corner, onto the end of the line, then riding the dot
    const A = clamp01((T - 2.0) / 0.9), ex = CX + PX + PW, ey = CY + lineY(PX + PW);
    const px = (T < 2.9 ? 1040 + (ex - 1040) * eo(A) : CX + x) - 6, py = (T < 2.9 ? 1050 + (ey - 1050) * eo(A) : CY + y) - 4;
    gsap.set(cur, { x: px, y: py, opacity: clamp01((T - 2.0) / 0.25) });
  };
  const clock = { T: 0 };
  scene(0);
  tl.fromTo(clock, { T: 0 }, { T: 6, duration: 6, ease: "none", onUpdate: () => scene(clock.T), immediateRender: false }, 0);
  RC.camera(tl, "#root .cam", 0, { duration: 6, to: { scale: 1.03 } });
  RC.drift(tl, "#root .rc-mesh", 0, { duration: 6, x: 50, y: -30, scale: 1.08 });
  RC.hold(tl, 5.95);
  window.__timelines["line-chart-scrub"] = tl;
})();
</script>
</template>
</body></html>

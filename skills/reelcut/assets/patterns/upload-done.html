<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /></head><body>
<template>
<style>
  /* UPLOAD TO DONE. A drop zone waits; three files arrive from three sides and settle into a list;
     a ring fills as they upload — each file has its own bar, and the ring is honestly the average of
     them — the files tick off one by one, the ring closes on a check, and then the whole card
     collapses, by its own corners, into one small pill: 3 files uploaded. One long motion with a
     clear end, and the end is smaller than the start.
     Grid: the card is on the 84px margins (84 to 996), 660 tall from the content top (336). The drop
     zone is inset 28; the ring is 300 wide on the left, the three file rows 400 wide on the right with
     a 56 gutter, the pair centred in the zone (47 either side); rows are 96 tall on a 120 pitch. The collapse lands on a 440 by 104 pill at the card's
     centre (540, 666). The shadow belongs to a wrapper, so it survives the card being clipped. */
  #root { --accent: #2f5bff; }
  #root .cam { position: absolute; inset: 0; transform-origin: 540px 540px; }
  #root .wrap { position: absolute; left: 84px; top: 336px; width: 912px; height: 660px; filter: drop-shadow(0 26px 34px rgba(20,40,90,.22)) drop-shadow(0 6px 10px rgba(20,40,90,.10)); }
  #root .card { position: absolute; left: 0; top: 0; width: 912px; height: 660px; border-radius: 36px; box-shadow: none; }
  #root .dz { position: absolute; left: 28px; top: 28px; width: 856px; height: 604px; border-radius: 28px; border: 3px dashed color-mix(in oklab, var(--accent) 45%, transparent); }
  #root .pre { position: absolute; left: 0; top: 0; width: 912px; height: 660px; }
  #root .pre .tile { position: absolute; left: 404px; top: 228px; width: 104px; height: 104px; border-radius: 30px; background: color-mix(in oklab, var(--accent) 12%, transparent); }
  #root .pre .tile::before { content: ""; position: absolute; left: 40px; top: 30px; width: 24px; height: 40px; background: var(--accent); clip-path: polygon(50% 0, 100% 42%, 70% 42%, 70% 100%, 30% 100%, 30% 42%, 0 42%); }
  #root .pre .tile::after { content: ""; position: absolute; left: 28px; top: 76px; width: 48px; height: 5px; border-radius: 3px; background: var(--accent); }
  #root .pre .lab { position: absolute; left: 0; width: 912px; top: 356px; text-align: center; font-size: 36px; line-height: 44px; font-weight: 650; letter-spacing: -0.025em; }
  #root .pre .sub { position: absolute; left: 0; width: 912px; top: 408px; text-align: center; font: 500 22px/26px var(--font-mono); color: var(--card-muted); letter-spacing: .02em; }
  #root .ringbox { position: absolute; left: 78px; top: 180px; width: 300px; height: 300px; }
  #root .ringbox svg { position: absolute; inset: 0; width: 300px; height: 300px; }
  #root .ringbox circle { stroke-width: 22px; }
  #root .ringbox .pct { position: absolute; left: 0; width: 300px; top: 104px; text-align: center; font-size: 80px; line-height: 84px; font-weight: 700; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; }
  #root .ringbox .up { position: absolute; left: 0; width: 300px; top: 192px; text-align: center; font: 500 20px/24px var(--font-mono); letter-spacing: .14em; color: var(--card-muted); }
  #root .ringbox .okk { position: absolute; left: 100px; top: 100px; width: 100px; height: 100px; opacity: 0; }
  #root .ringbox .okk path { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
  #root .file { position: absolute; left: 434px; width: 400px; height: 96px; border-radius: 24px; background: color-mix(in oklab, var(--ink) 5%, transparent); }
  #root .f1 { top: 162px; } #root .f2 { top: 282px; } #root .f3 { top: 402px; }
  #root .file .ic { position: absolute; left: 20px; top: 20px; width: 56px; height: 56px; border-radius: 16px; background: color-mix(in oklab, var(--accent) 14%, transparent); }
  #root .file .ic::before { content: ""; position: absolute; left: 17px; top: 13px; width: 22px; height: 30px; border-radius: 4px; background: var(--accent); }
  #root .file .nm { position: absolute; left: 96px; top: 14px; font-size: 25px; line-height: 30px; font-weight: 650; letter-spacing: -0.02em; white-space: nowrap; }
  #root .file .sz { position: absolute; left: 96px; top: 44px; font: 500 19px/22px var(--font-mono); color: var(--card-muted); white-space: nowrap; }
  #root .file .rc-progress { position: absolute; left: 96px; top: 74px; width: 232px; height: 8px; }
  #root .file .st { position: absolute; right: 22px; top: 30px; width: 36px; height: 36px; border-radius: 50%; border: 3px solid color-mix(in oklab, var(--ink) 16%, transparent); }
  #root .file .dn { position: absolute; right: 22px; top: 30px; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); opacity: 0; }
  #root .file .dn svg { position: absolute; inset: 0; } #root .file .dn path { fill: none; stroke: #fff; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
  #root .fin { position: absolute; left: 236px; top: 278px; width: 440px; height: 104px; display: flex; align-items: center; justify-content: center; gap: 18px; opacity: 0;
    font-size: 32px; font-weight: 650; letter-spacing: -0.02em; white-space: nowrap; }
  #root .fin .ck { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); position: relative; flex: none; }
  #root .fin .ck svg { position: absolute; inset: 0; } #root .fin .ck path { fill: none; stroke: #fff; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
  #root .fin small { font: 500 22px var(--font-mono); color: var(--muted); font-weight: 500; margin-left: 2px; }
</style>
<div id="root" data-look="cool" data-composition-id="upload-done" data-width="1080" data-height="1080">
  <div class="rc-mesh" style="--mesh-1: rgba(47,91,255,.2); --mesh-2: rgba(125,153,255,.22)"></div>
  <div class="rc-dots" style="opacity:.5"></div>
  <div class="cam">
    <div class="rc-head"><span class="ln" style="--ox:-4.3px">Drop it in.</span><span class="ln" style="--ox:4.7px"><em class="rc">Done in seconds.</em></span></div>
    <div class="wrap">
      <div class="rc-card card">
        <div class="dz"></div>
        <div class="pre"><span class="tile"></span><div class="lab">Drop files to upload</div><div class="sub">or browse</div></div>
        <div class="ringbox">
          <svg class="rc-ring" viewBox="0 0 300 300"><circle class="t" cx="150" cy="150" r="130"/><circle class="v" cx="150" cy="150" r="130"/></svg>
          <div class="pct">0%</div><div class="up">UPLOADING</div>
          <svg class="okk" viewBox="0 0 100 100"><path d="M 26 52 L 43 69 L 76 32"/></svg>
        </div>
        <div class="file f1"><span class="ic"></span><div class="nm">brand-guide.pdf</div><div class="sz">2.4 MB</div><div class="rc-progress"><i></i></div><span class="st"></span><span class="dn"><svg viewBox="0 0 36 36"><path d="M 10 19 L 16 25 L 27 12"/></svg></span></div>
        <div class="file f2"><span class="ic"></span><div class="nm">launch-film.mov</div><div class="sz">48 MB</div><div class="rc-progress"><i></i></div><span class="st"></span><span class="dn"><svg viewBox="0 0 36 36"><path d="M 10 19 L 16 25 L 27 12"/></svg></span></div>
        <div class="file f3"><span class="ic"></span><div class="nm">copy-v3.docx</div><div class="sz">120 KB</div><div class="rc-progress"><i></i></div><span class="st"></span><span class="dn"><svg viewBox="0 0 36 36"><path d="M 10 19 L 16 25 L 27 12"/></svg></span></div>
        <div class="fin"><span class="ck"><svg viewBox="0 0 56 56"><path d="M 16 29 L 25 38 L 41 19"/></svg></span>3 files uploaded<small>2.4 s</small></div>
      </div>
    </div>
  </div>
  <div class="rc-grain"></div>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  RC.words(tl, "#root .rc-head", 0, { lead: true, stagger: 0.09, blur: 14, y: 20 });
  // The drop zone is whole at frame 0; it settles and its call to action resolves.
  tl.fromTo("#root .wrap", { y: 50, opacity: 0.75 }, { y: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, 0.05);
  // Three files arrive from three sides, each out of soft focus, and take their rows.
  [["f1", -300, -140], ["f2", 320, -60], ["f3", 40, 240]].forEach(([f, dx, dy], i) => {
    const t = 0.8 + i * 0.2;
    tl.fromTo("#root ." + f, { x: dx, y: dy, opacity: 0, scale: 0.9 }, { x: 0, y: 0, opacity: 1, scale: 1, duration: 0.85, ease: "expo.out" }, t);
    tl.fromTo("#root ." + f, { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, t);
  });
  tl.to("#root .pre", { opacity: 0, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, 0.5);
  // The ring appears where the call to action was, and starts when the last file lands.
  const ring = document.querySelector("#root .ringbox .v"), L = 2 * Math.PI * 130;
  ring.style.strokeDasharray = L + " " + L; ring.style.strokeDashoffset = L;
  tl.fromTo("#root .ringbox", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.7, ease: "expo.out" }, 1.15);
  tl.fromTo("#root .ringbox", { filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 1.15);
  // One state drives the lot: every bar is a window of it and the ring is the average of the bars.
  const T0 = 1.6, DUR = 2.0, win = [[0, 0.55], [0.15, 0.8], [0.3, 1]];
  const bars = ["f1", "f2", "f3"].map((f) => document.querySelector("#root ." + f + " .rc-progress > i"));
  const pct = document.querySelector("#root .ringbox .pct");
  bars.forEach((b) => { b.style.transformOrigin = "0 50%"; b.style.transform = "scaleX(0)"; });
  const st = { t: 0 };
  const paint = () => {
    let sum = 0;
    win.forEach(([a, b], i) => { const r = Math.min(1, Math.max(0, (st.t - a) / (b - a))); sum += r; bars[i].style.transform = "scaleX(" + r.toFixed(4) + ")"; });
    const m = sum / 3;
    ring.style.strokeDashoffset = (L * (1 - m)).toFixed(2);
    pct.textContent = Math.round(m * 100) + "%";
  };
  paint();
  tl.fromTo(st, { t: 0 }, { t: 1, duration: DUR, ease: "none", onUpdate: paint, immediateRender: false }, T0);
  // Each file ticks off the moment its own bar is full.
  ["f1", "f2", "f3"].forEach((f, i) => {
    const at = T0 + win[i][1] * DUR;
    tl.fromTo("#root ." + f + " .dn", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, at);
    RC.draw(tl, "#root ." + f + " .dn path", at + 0.05, { duration: 0.3 });
  });
  // The ring closes on a check.
  const END = T0 + DUR;
  tl.to("#root .ringbox .pct, #root .ringbox .up", { opacity: 0, duration: 0.25 }, END + 0.1);
  tl.to("#root .ringbox .okk", { opacity: 1, duration: 0.01 }, END + 0.25);
  RC.draw(tl, "#root .ringbox .okk path", END + 0.25, { duration: 0.45 });
  // The collapse: the content clears, then the card closes on itself into a pill.
  const C = END + 0.85;
  tl.to("#root .file, #root .ringbox, #root .dz", { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, C);
  tl.fromTo("#root .card", { clipPath: "inset(0px 0px 0px 0px round 36px)" }, { clipPath: "inset(278px 236px 278px 236px round 52px)", duration: 0.85, ease: "expo.inOut", immediateRender: false }, C + 0.15);
  tl.to("#root .fin", { opacity: 1, duration: 0.4, ease: "power2.out" }, C + 0.7);
  RC.draw(tl, "#root .fin .ck path", C + 0.8, { duration: 0.35 });
  RC.camera(tl, "#root .cam", 0, { duration: 6.3, to: { scale: 1.03 } });
  RC.drift(tl, "#root .rc-mesh", 0, { duration: 6.3, x: 50, y: -30, scale: 1.08 });
  RC.hold(tl, 6.25);
  window.__timelines["upload-done"] = tl;
})();
</script>
</template>
</body></html>

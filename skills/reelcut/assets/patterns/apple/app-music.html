<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /></head><body>
<template>
<style>
  /* APP MUSIC. Now Playing (ink look; the background is the artwork's own colour, blurred). Paused, the artwork rests
     a little smaller; Play is tapped and it grows to full size on spring.default while the glyph cross-fades to Pause.
     The playhead runs at the song's own speed (linear). A finger takes the scrubber: the bar thickens under it, the
     playhead is dragged like a hand to the chorus and the times count with it; released, the bar slims back. Pause:
     the artwork rests smaller again. Text is white on the art colour, Apple's label alphas.
     Grid: the UI is the frame. The phone at --pt 1.45, centred (x 231 → 849), from y 44, cropped by the bottom edge. */
  #root { --accent: #ff375f; }
  #root .cam { position: absolute; inset: 0; transform-origin: 540px 540px; }
  #root .ph { left: 231px; top: 44px; --pt: 1.45px; }
  #root .bg { position: absolute; inset: -10%; background: radial-gradient(60% 40% at 30% 25%, #ff7a59, transparent 70%), radial-gradient(70% 50% at 80% 70%, #7a2bd6, transparent 70%), #2a0f2e;
    filter: blur(30px); }
  #root .rc-art { left: calc(40 * var(--pt)); top: calc(96 * var(--pt)); width: calc(322 * var(--pt)); height: calc(322 * var(--pt));
    background: radial-gradient(60% 60% at 30% 30%, #ffd08a, transparent 60%), radial-gradient(70% 70% at 75% 75%, #ff3d6e, transparent 65%), linear-gradient(150deg, #ff8a4c, #7a2bd6); }
  #root .rc-art::after { content: ""; position: absolute; left: 18%; bottom: 16%; width: 30%; height: 30%; border-radius: 50%; background: rgba(255,255,255,.35); }
  #root .rc-np-meta { position: absolute; left: calc(40 * var(--pt)); right: calc(40 * var(--pt)); top: calc(452 * var(--pt)); }
  #root .rc-scrub { left: calc(40 * var(--pt)); right: calc(40 * var(--pt)); top: calc(512 * var(--pt)); transform-origin: 50% 50%; }
  #root .rc-np-ctl { left: calc(70 * var(--pt)); right: calc(70 * var(--pt)); top: calc(574 * var(--pt)); height: calc(60 * var(--pt)); }
  #root .rc-np-ctl > svg { width: calc(40 * var(--pt)); height: calc(40 * var(--pt)); }
  #root .rc-pp > svg { width: calc(52 * var(--pt)); height: calc(52 * var(--pt)); }
  #root .rc-pp .rc-pause { opacity: 0; }
  #root .rc-touch { --pt: 1.45px; }
</style>
<div id="root" data-look="ink" data-composition-id="app-music" data-width="1080" data-height="1080">
  <div class="rc-mesh" style="--mesh-1: rgba(255,122,89,.20); --mesh-2: rgba(122,43,214,.22)"></div>
  <div class="cam">
    <div class="rc-iphone rc-dark ph">
      <div class="rc-scr">
        <div class="bg"></div>
        <div class="rc-np">
          <div class="rc-art"></div>
          <div class="rc-np-meta"><b>Late Bloom</b><span>Mira Kalo</span></div>
          <div class="rc-scrub"><span class="rc-sc-fill"></span><div class="rc-sc-times"><span>1:08</span><span>-2:26</span></div></div>
          <div class="rc-np-ctl">
            <svg viewBox="0 0 24 24"><path d="M11 6v12L3 12zM20 6v12l-8-6z"/></svg>
            <span class="rc-pp"><svg class="rc-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg><svg class="rc-pause" viewBox="0 0 24 24"><rect x="5.5" y="4.5" width="4.6" height="15" rx="1.3"/><rect x="13.9" y="4.5" width="4.6" height="15" rx="1.3"/></svg></span>
            <svg viewBox="0 0 24 24"><path d="M4 6v12l8-6zM13 6v12l8-6z"/></svg>
          </div>
        </div>
        <div class="rc-status"><b>9:41</b><i class="rc-island"></i><span class="rc-sys"></span></div>
      </div>
    </div>
    <div class="rc-touch"></div>
  </div>
  <div class="rc-grain"></div>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  const P = 1.45, X = (x) => 231 + 12 * P + x * P, Y = (y) => 44 + 12 * P + y * P;
  gsap.set("#root .rc-art", { scale: 0.84 });
  const TOTAL = 214, p0 = 68 / TOTAL;
  // Play.
  tl.set("#root .rc-touch", { opacity: 0 }, 0);
  RC.cursor(tl, "#root .rc-touch", 0.2, [[X(240), Y(680), 0], [X(201), Y(604), 0.45]]);
  tl.to("#root .rc-touch", { opacity: 1, duration: 0.2, ease: "apple.out" }, 0.2);
  RC.press(tl, "#root .rc-touch", 0.7, { scale: 0.85 });
  RC.playPause(tl, "#root .rc-np", 0.7, true);
  RC.scrubTo(tl, "#root .rc-scrub", 0.75, 1.75, p0, p0 + 1.75 / TOTAL, { total: TOTAL });
  // Scrub to the chorus: the finger takes the playhead, the bar thickens, the drag is a hand's.
  const W = 322, at0 = p0 + 1.75 / TOTAL, at1 = 0.62;
  RC.cursor(tl, "#root .rc-touch", 1.4, [[X(40 + W * at0), Y(515), 0.8]]);
  RC.press(tl, "#root .rc-touch", 2.3, { scale: 0.85, release: false });
  RC.to(tl, "#root .rc-scrub", 2.3, { height: 11 * P, marginTop: -2 * P }, "snappy");
  RC.scrubTo(tl, "#root .rc-scrub", 2.5, 0.9, at0, at1, { total: TOTAL, ease: "apple.glide", set: false });
  tl.to("#root .rc-touch", { x: X(40 + W * at1), duration: 0.9, ease: "apple.glide" }, 2.5);
  RC.to(tl, "#root .rc-scrub", 3.5, { height: 7 * P, marginTop: 0 }, "default");
  RC.to(tl, "#root .rc-touch", 3.5, { scale: 1 }, "snappy");
  RC.scrubTo(tl, "#root .rc-scrub", 3.5, 0.9, at1, at1 + 0.9 / TOTAL, { total: TOTAL, set: false });
  // Pause: the artwork rests.
  RC.cursor(tl, "#root .rc-touch", 3.75, [[X(201), Y(604), 0.45]]);
  RC.press(tl, "#root .rc-touch", 4.3, { scale: 0.85 });
  RC.playPause(tl, "#root .rc-np", 4.3, false);
  tl.to("#root .rc-touch", { opacity: 0, duration: 0.2, ease: "apple.exit" }, 4.55);
  RC.camera(tl, "#root .cam", 0, { duration: 5.4, to: { scale: 1.02 } });
  RC.drift(tl, "#root .rc-mesh", 0, { duration: 5.4, x: 40, y: -20, scale: 1.06 });
  RC.hold(tl, 5.4);
  window.__timelines["app-music"] = tl;
})();
</script>
</template>
</body></html>

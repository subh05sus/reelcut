<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /></head><body>
<template>
<style>
  /* MAC MENU. A Tahoe screen (ink look) in the content region. The cursor opens the File menu: the title fills, the
     menu appears in 120 ms (macOS menus do not travel), the highlight glides from row to row on a snappy spring with
     the label turning white, Export as PDF… is chosen and the highlight blinks once — the Mac's own confirmation —
     before the menu fades. Then a right-click on a file on the desktop: the context menu appears at the cursor, Rename
     is chosen the same way. Menus are solid, elevated, 12 pt corners; nothing bounces.
     Grid: headline at (84, 96); the screen 912 × 660 on the margins (84 → 996, 336 → 996), radius 28; --pt 2. */
  #root { --accent: #0a84ff; --pt: 2px; }
  #root .cam { position: absolute; inset: 0; transform-origin: 540px 640px; }
  #root .scr { position: absolute; left: 84px; top: 336px; width: 912px; height: 660px; border-radius: 28px; overflow: hidden; box-shadow: var(--shadow);
    background: radial-gradient(70% 70% at 15% 20%, rgba(10,132,255,.45), transparent 70%), radial-gradient(70% 70% at 90% 90%, rgba(219,52,242,.35), transparent 70%), #0b0b12; }
  #root .rc-menubar { --mb-ink: #fff; background: rgba(0,0,0,.18); }
  #root .rc-menubar > b { font-weight: 700; }
  #root .file { position: absolute; left: 330px; top: 250px; width: 120px; text-align: center; color: #fff; font: 500 24px/1.2 var(--ui-font); }
  #root .file i { display: block; width: 92px; height: 112px; margin: 0 auto 10px; border-radius: 10px; background: linear-gradient(#fff, #e6e9f0); position: relative; box-shadow: 0 8px 20px rgba(0,0,0,.4); }
  #root .file i::after { content: "PDF"; position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font: 800 20px/1 var(--ui-font); color: #ff3b30; }
  #root .m1 { left: 0; top: 48px; }
  #root .m2 { left: 0; top: 0; min-width: calc(190 * var(--pt)); }
</style>
<div id="root" data-look="ink" data-composition-id="mac-menu" data-width="1080" data-height="1080">
  <div class="rc-mesh" style="--mesh-1: rgba(10,132,255,.14); --mesh-2: rgba(219,52,242,.08)"></div>
  <div class="cam">
    <div class="rc-head"><span class="ln" style="--ox:-1.4px">Right where</span><span class="ln" style="--ox:3px"><em class="rc">you look.</em></span></div>
    <div class="scr">
      <div class="rc-menubar"><svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.8-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9-.1 0-2.6-1-2.6-4.1zM13.9 5c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3.1-1.5z"/></svg>
        <b>Notes</b><span class="ft">File</span><span>Edit</span><span>Format</span><span>View</span><span>Window</span><span class="rc-mb-r">Tue 9:41</span></div>
      <div class="file"><i></i>Brief.pdf</div>
      <div class="rc-mmenu m1"><span class="rc-mm-hl"></span>
        <div class="rc-mm-row">New Note<kbd>⌘N</kbd></div><div class="rc-mm-row">New Folder<kbd>⇧⌘N</kbd></div><div class="rc-mm-sep"></div>
        <div class="rc-mm-row">Duplicate<kbd>⌘D</kbd></div><div class="rc-mm-row">Export as PDF…</div><div class="rc-mm-sep"></div>
        <div class="rc-mm-row">Print…<kbd>⌘P</kbd></div></div>
      <div class="rc-mmenu m2"><span class="rc-mm-hl"></span>
        <div class="rc-mm-row">Open</div><div class="rc-mm-row">Quick Look</div><div class="rc-mm-sep"></div>
        <div class="rc-mm-row">Rename</div><div class="rc-mm-row">Compress</div><div class="rc-mm-row">Share…</div></div>
    </div>
  </div>
  <div class="rc-grain"></div>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  const scr = document.querySelector("#root .scr"), ft = document.querySelector("#root .ft");
  const m1 = document.querySelector("#root .m1"), m2 = document.querySelector("#root .m2");
  gsap.set(m1, { x: ft.offsetLeft - 10 });
  const cur = RC.cursorEl(scr);
  RC.words(tl, "#root .rc-head", 0, { lead: true, stagger: 0.08 });
  // Rows' vertical centres in the screen: the menu's top + its 10 px padding + the row's own offset.
  const rowY = (m, i, top) => top + m.querySelectorAll(".rc-mm-row")[i].offsetTop + 24;
  RC.cursor(tl, cur, 0, [[520, 420, 0], [ft.offsetLeft + 26, 22, 0.7]]);
  RC.click(tl, cur, 0.75, { ripple: false });
  RC.menuOpen(tl, m1, 0.78, { title: ft });
  RC.cursor(tl, cur, 0.95, [[ft.offsetLeft + 90, rowY(m1, 0, 48), 0.3]]);
  RC.menuHover(tl, m1, 1.15, 0);
  RC.cursor(tl, cur, 1.3, [[ft.offsetLeft + 110, rowY(m1, 2, 48), 0.35]]);
  RC.menuHover(tl, m1, 1.48, 1);
  RC.menuHover(tl, m1, 1.6, 2);
  RC.cursor(tl, cur, 1.7, [[ft.offsetLeft + 120, rowY(m1, 3, 48), 0.25]]);
  RC.menuHover(tl, m1, 1.85, 3);
  RC.click(tl, cur, 2.15, { ripple: false });
  RC.menuChoose(tl, m1, 2.15, 3);
  // Right-click the file: the menu appears at the cursor.
  const px = 330 + 60, py = 250 + 60;
  RC.cursor(tl, cur, 2.6, [[px, py, 0.6]]);
  RC.click(tl, cur, 3.25, { ripple: false });
  gsap.set(m2, { x: px + 4, y: py + 4 });
  RC.menuOpen(tl, m2, 3.3);
  RC.cursor(tl, cur, 3.5, [[px + 70, py + 4 + rowY(m2, 1, 0), 0.3]]);
  RC.menuHover(tl, m2, 3.7, 1);
  RC.cursor(tl, cur, 3.9, [[px + 80, py + 4 + rowY(m2, 2, 0), 0.25]]);
  RC.menuHover(tl, m2, 4.05, 2);
  RC.click(tl, cur, 4.35, { ripple: false });
  RC.menuChoose(tl, m2, 4.35, 2);
  RC.camera(tl, "#root .cam", 0, { duration: 5.4, to: { scale: 1.02 } });
  RC.drift(tl, "#root .rc-mesh", 0, { duration: 5.4, x: 40, y: -20, scale: 1.06 });
  RC.hold(tl, 5.4);
  window.__timelines["mac-menu"] = tl;
})();
</script>
</template>
</body></html>

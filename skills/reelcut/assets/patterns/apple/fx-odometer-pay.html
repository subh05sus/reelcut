<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /></head><body>
<template>
<style>
  /* FX ODOMETER PAY. A wallet card (cool look). Ana has sent €747; Accept is pressed: the button keeps its width while
     its label gives way to a spinner turning at a steady pace, then a check pops (0.5 → 1, snappy) and draws, the
     capsule turning green. The balance answers: only the digits that change roll, upward because it grew, settling
     right to left 20 ms apart, while "+€747.00" rises 18 pt in green and fades. Calm, exact, nothing bounces.
     Grid: headline at (84, 96); the card on the margins (84 → 996), from 336 to 996, padding 48. */
  #root { --accent: #2f5bff; }
  #root .cam { position: absolute; inset: 0; transform-origin: 540px 640px; }
  #root .card { position: absolute; left: 84px; top: 336px; width: 912px; height: 660px; border-radius: 40px; background: var(--card); box-shadow: var(--shadow); --pt: 2px; }
  #root .lbl { position: absolute; left: 48px; top: 44px; font: 500 30px/1 var(--ui-font); color: var(--ui-label-2); }
  #root .bal { position: absolute; left: 44px; top: 90px; font: 650 112px/1 var(--ui-font); letter-spacing: -0.035em; color: var(--ui-label); }
  #root .rc-delta { left: 52px; top: 228px; font-size: 34px; }
  #root .hr { position: absolute; left: 48px; right: 48px; top: 300px; height: 1px; background: var(--ui-sep); }
  #root .who { position: absolute; left: 48px; right: 48px; top: 340px; display: flex; align-items: center; gap: 24px; }
  #root .who i { width: 88px; height: 88px; border-radius: 50%; background: linear-gradient(150deg,#ffcf8a,#ff9230); flex: none; }
  #root .who b { display: block; font: 650 34px/1.15 var(--ui-font); letter-spacing: -0.02em; }
  #root .who span { font: 400 28px/1.3 var(--ui-font); color: var(--ui-label-2); }
  #root .who em { margin-left: auto; font: 650 34px/1 var(--ui-font); font-style: normal; color: var(--ui-label); }
  #root .rc-abtn { position: absolute; left: 48px; top: 512px; width: 816px; }
</style>
<div id="root" data-look="cool" data-composition-id="fx-odometer-pay" data-width="1080" data-height="1080">
  <div class="rc-mesh" style="--mesh-1: rgba(47,91,255,.14); --mesh-2: rgba(48,209,88,.08)"></div>
  <div class="cam">
    <div class="rc-head"><span class="ln" style="--ox:-1.6px">Money in,</span><span class="ln" style="--ox:3px"><em class="rc">instantly.</em></span></div>
    <div class="card">
      <div class="lbl">Balance</div>
      <div class="bal rc-num">€1,284.00</div>
      <div class="rc-delta">+€747.00</div>
      <div class="hr"></div>
      <div class="who"><i></i><div><b>Ana sent you money</b><span>Lunch and concert tickets</span></div><em>€747.00</em></div>
      <div class="rc-abtn"><span class="rc-lbl">Accept €747</span><i class="rc-spin"></i><span class="rc-check-d"></span></div>
    </div>
  </div>
  <div class="rc-grain"></div>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  RC.words(tl, "#root .rc-head", 0, { lead: true, stagger: 0.08 });
  RC.present(tl, "#root .card", 0.05, { y: 40, scale: 1, spring: "gentle", lead: true });
  RC.asyncButton(tl, "#root .rc-abtn", 1.0, { work: 1.0, doneColor: "#1f9d55", reset: false });
  RC.numeric(tl, "#root .bal", 2.45, { values: ["€1,284.00", "€2,031.00"] });
  RC.delta(tl, "#root .rc-delta", 2.5, { duration: 1.6 });
  RC.camera(tl, "#root .cam", 0, { duration: 4.8, to: { scale: 1.025 } });
  RC.drift(tl, "#root .rc-mesh", 0, { duration: 4.8, x: 40, y: -20, scale: 1.06 });
  RC.hold(tl, 4.8);
  window.__timelines["fx-odometer-pay"] = tl;
})();
</script>
</template>
</body></html>

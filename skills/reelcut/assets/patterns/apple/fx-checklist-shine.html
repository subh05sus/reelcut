<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /></head><body>
<template>
<style>
  /* FX CHECKLIST SHINE. A launch checklist (ink look). Three items complete one by one: the disc grows from 0.4 on a
     snappy spring and the tick draws after it, the label dims; "Saved ✓" fades in under the title and leaves after
     1.4 s; the progress ring fills on a soft spring and turns into a check. Then the one earned moment of the beat:
     Publish wobbles like a droplet (its volume kept), a band of light sweeps it, a rainbow-fringed bloom breathes
     behind it, and a little confetti — seeded, finite, under gravity — goes up from it.
     Grid: headline at (84, 96); the card on the margins (84 → 996), 336 → 996, padding 48; rows 100 px. */
  #root { --accent: #30d158; }
  #root .cam { position: absolute; inset: 0; transform-origin: 540px 640px; }
  #root .card { position: absolute; left: 84px; top: 336px; width: 912px; height: 660px; border-radius: 40px; background: var(--ui-cell); box-shadow: var(--shadow); --pt: 1.8px; }
  #root .ttl { position: absolute; left: 48px; top: 44px; font: 650 42px/1 var(--ui-font); letter-spacing: -0.025em; color: var(--ui-label); }
  #root .rc-saved { position: absolute; left: 48px; top: 104px; font-size: 28px; }
  #root .rc-pring { position: absolute; right: 48px; top: 34px; --rs: 54; }
  #root .row { position: absolute; left: 48px; right: 48px; height: 100px; display: flex; align-items: center; gap: 24px; font: 400 34px/1 var(--ui-font); letter-spacing: -0.02em; color: var(--ui-label); }
  #root .row::after { content: ""; position: absolute; left: 72px; right: 0; bottom: 0; height: 1px; background: var(--ui-sep); }
  #root .row .box { position: relative; width: 48px; height: 48px; flex: none; }
  #root .row .box::before { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--ui-label-3); }
  #root .row .rc-check-d { position: absolute; inset: 0; --cs: 26.6; }
  #root .r1 { top: 160px; } #root .r2 { top: 260px; } #root .r3 { top: 360px; }
  #root .pub { position: absolute; left: 48px; top: 512px; width: 816px; height: 100px; border-radius: 50px; display: grid; place-items: center;
    background: var(--ui-tint); color: #04130a; font: 650 36px/1 var(--ui-font); letter-spacing: -0.02em; }
</style>
<div id="root" data-look="ink" data-composition-id="fx-checklist-shine" data-width="1080" data-height="1080">
  <div class="rc-mesh" style="--mesh-1: rgba(48,209,88,.12); --mesh-2: rgba(109,124,255,.10)"></div>
  <div class="cam">
    <div class="rc-head"><span class="ln" style="--ox:-1.4px">Done, and</span><span class="ln" style="--ox:3px"><em class="rc">it shows.</em></span></div>
    <div class="card">
      <div class="ttl">Launch checklist</div>
      <div class="rc-saved"><span class="rc-check-d"></span><span>Saved</span></div>
      <div class="rc-pring"><svg viewBox="0 0 64 64"><circle class="t" cx="32" cy="32" r="27"/><circle class="v" cx="32" cy="32" r="27"/></svg><span class="rc-check-d"></span></div>
      <div class="row r1"><span class="box"><span class="rc-check-d"></span></span><span class="tx">Write the release notes</span></div>
      <div class="row r2"><span class="box"><span class="rc-check-d"></span></span><span class="tx">Record the demo</span></div>
      <div class="row r3"><span class="box"><span class="rc-check-d"></span></span><span class="tx">Schedule the post</span></div>
      <div class="pub">Publish</div>
    </div>
    <div class="fx"></div>
  </div>
  <div class="rc-grain"></div>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  RC.words(tl, "#root .rc-head", 0, { lead: true, stagger: 0.08 });
  RC.present(tl, "#root .card", 0.05, { y: 40, scale: 1, spring: "gentle", lead: true });
  gsap.set("#root .rc-pring circle.v", { strokeDasharray: 2 * Math.PI * 27, strokeDashoffset: 2 * Math.PI * 27 * 0.75 });
  ["r1", "r2", "r3"].forEach((r, i) => {
    const t = 0.8 + i * 0.45;
    RC.checkDraw(tl, "#root ." + r + " .rc-check-d", t);
    tl.to("#root ." + r + " .tx", { color: "rgba(235,235,245,.6)", duration: 0.25, ease: "apple.out" }, t + 0.1);
    tl.to("#root .rc-pring circle.v", { strokeDashoffset: 2 * Math.PI * 27 * (0.75 - 0.25 * (i + 1)), duration: 0.5, ease: "spring.default" }, t);
  });
  RC.saved(tl, "#root .rc-saved", 1.85, { hold: 1.4 });
  // The ring has filled with the last item; it becomes a check.
  RC.ringDone(tl, "#root .rc-pring", 1.9, { duration: 0.3 });
  // The earned moment.
  RC.shine(tl, "#root .pub", 3.0);
  RC.confetti(tl, "#root .fx", 3.05, { x: 540, y: 336 + 562, count: 46, seed: 5, speed: 1150, spread: 1.4, duration: 1.9 });
  RC.camera(tl, "#root .cam", 0, { duration: 5.2, to: { scale: 1.025 } });
  RC.drift(tl, "#root .rc-mesh", 0, { duration: 5.2, x: 40, y: -20, scale: 1.06 });
  RC.hold(tl, 5.2);
  window.__timelines["fx-checklist-shine"] = tl;
})();
</script>
</template>
</body></html>

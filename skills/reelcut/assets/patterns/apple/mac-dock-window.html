<style>
  /* MAC DOCK WINDOW. A Tahoe desktop (the UI is the frame). The cursor comes down to the Dock and runs along it: the
     icons magnify around it with a smooth falloff and the shelf widens to hold them, all following the cursor's own
     hand-like path. It clicks Notes: the icon bounces twice (up decelerating, down accelerating, the second hop lower)
     and its window opens out of it on spring.page; the running dot appears. The cursor leaves (the Dock settles back),
     goes to the sidebar, and the selection glides from Ideas to Travel; the list changes under the toolbar.
     Glass: the Dock and the sidebar slab (the functional layer); the window and its list are content.
     Grid: --pt 2. Window 880 × 560 at (100, 150); Dock centred, its shelf 84 px above the frame's bottom. */
  #root { --accent: #f5b400; --pt: 2px; }
  #root .cam { position: absolute; inset: 0; transform-origin: 540px 540px; }
  #root .wall { position: absolute; inset: 0;
    background: radial-gradient(70% 60% at 20% 20%, color-mix(in oklab, var(--accent) 40%, transparent), transparent 70%),
                radial-gradient(70% 60% at 85% 75%, rgba(47,91,255,.4), transparent 70%), linear-gradient(160deg, #f3efe8, #dfe5f2); }
  #root .win { left: 100px; top: 150px; width: 880px; height: 560px; --sw: 150; }
  #root .dock { left: 110px; top: 856px; }
  #root .notes .rc-mac-item i { background: linear-gradient(150deg,#ffe36e,#f5b400); }
  #root .set2 { opacity: 0; }
  #root .rc-cursor { width: 44px; height: 44px; }
</style>

<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  RC.glass();
  RC.dockSet("#root .dock");
  const cur = RC.cursorEl("#root .cam");
  // Dock icon centres in the frame: the Dock starts at 110; each icon is 9 + 26 + 60 i points in.
  const ix = (i) => 110 + (35 + 60 * i) * 2, iy = 856 + 70;
  RC.dockHover(tl, "#root .dock", cur, 0, [[1000, 560, 0], [ix(0) + 20, iy, 1.0], [ix(3), iy, 0.85]], { enter: 1.05, leave: 2.75 });
  RC.click(tl, cur, 1.95, { target: "#root .ic-notes i", ripple: false });
  RC.dockBounce(tl, "#root .ic-notes", 2.0);
  RC.macOpen(tl, "#root .win", 2.25, { from: "#root .ic-notes", lead: false });
  gsap.set("#root .win", { opacity: 0 });
  RC.macSelectSet("#root .rc-mac-side", 1);
  // To the sidebar; Travel.
  RC.cursor(tl, cur, 2.8, [[100 + 8 * 2 + 70, 150 + (8 + 46 + 28 + 28 * 3 + 14) * 2, 0.75]]);
  RC.click(tl, cur, 3.65, { ripple: false });
  RC.macSelect(tl, "#root .rc-mac-side", 3.68, 3);
  tl.to("#root .set1, #root .t1", { opacity: 0, duration: 0.15, ease: "apple.exit" }, 3.7);
  tl.to("#root .set2", { opacity: 1, duration: 0.22, ease: "apple.out" }, 3.8);
  RC.rise(tl, "#root .set2 .rc-mac-item", 3.8, { y: 10, stagger: 0.04 });
  RC.camera(tl, "#root .cam", 0, { duration: 5.2, to: { scale: 1.02 } });
  RC.hold(tl, 5.2);
  window.__timelines["mac-dock-window"] = tl;
})();

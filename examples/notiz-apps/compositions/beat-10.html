<!doctype html>
<html lang="de">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* AN OUTLINE THAT NESTS. The claim is about nested research, so the frame nests: rows arrive
           top-down, each indented to its level, joined by the tree's own connectors, and the
           deepest one is picked out last. Abstract rows, no invented titles. */
        #root { position: absolute; inset: 0; background: #121a2b; color: #efe9df;
                font-family: Inter, Arial, Helvetica, sans-serif; overflow: hidden; }
        #root .line { position: absolute; left: 72px; top: 92px; width: 936px;
                      font-size: 54px; font-weight: 700; line-height: 1.16; letter-spacing: -0.025em; }
        #root .line .accent { color: #7fd3c3; }
        #root .row { position: absolute; height: 44px; display: flex; align-items: center; gap: 18px; }
        #root .dot { width: 18px; height: 18px; border-radius: 4px; background: #4f6f86; flex: none; }
        #root .bar { height: 18px; border-radius: 9px; background: #34425f; }
        #root .row.deep .dot, #root .row.deep .bar { background: #7fd3c3; }
        #root .stem { position: absolute; width: 3px; background: #2c3a56; transform-origin: 50% 0%; }
      </style>

      <div id="root" data-composition-id="beat-10" data-width="1080" data-height="1080">
        <div class="line">Für lange, <span class="accent">verschachtelte</span> Rechercheprojekte kann Notara hervorragend funktionieren.</div>

        <div class="stem" style="left: 81px; top: 452px; height: 430px"></div>
        <div class="stem" style="left: 171px; top: 524px; height: 218px"></div>
        <div class="stem" style="left: 261px; top: 596px; height: 74px"></div>

        <div class="row" data-row style="left: 72px; top: 430px"><i class="dot"></i><i class="bar" style="width: 860px"></i></div>
        <div class="row" data-row style="left: 162px; top: 502px"><i class="dot"></i><i class="bar" style="width: 780px"></i></div>
        <div class="row" data-row style="left: 252px; top: 574px"><i class="dot"></i><i class="bar" style="width: 640px"></i></div>
        <div class="row deep" data-row style="left: 342px; top: 646px"><i class="dot"></i><i class="bar" style="width: 600px"></i></div>
        <div class="row" data-row style="left: 252px; top: 718px"><i class="dot"></i><i class="bar" style="width: 560px"></i></div>
        <div class="row" data-row style="left: 162px; top: 790px"><i class="dot"></i><i class="bar" style="width: 740px"></i></div>
        <div class="row" data-row style="left: 162px; top: 862px"><i class="dot"></i><i class="bar" style="width: 660px"></i></div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          // Reading floor: 8 words needs 2.4s settled in a 2.97s beat — the tightest of the four.
          // The line is fully in by 0.28s and then does not move.
          tl.fromTo("#root .line", { y: 12, opacity: 0.55 }, { y: 0, opacity: 1, duration: 0.28, ease: "power3.out" }, 0);
          tl.fromTo("#root .stem", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power2.out", stagger: 0.12 }, 0.22);
          tl.fromTo("#root [data-row]", { x: -22, opacity: 0 }, { x: 0, opacity: 1, duration: 0.24, ease: "power3.out", stagger: 0.1 }, 0.26);
          // The deepest level is the point of the sentence, so it is picked out once the tree is built.
          tl.fromTo("#root .row.deep", { scale: 1 }, { scale: 1.06, duration: 0.22, ease: "power2.out" }, 1.25);
          tl.to("#root .row.deep", { scale: 1, duration: 0.3, ease: "power2.inOut" }, 1.47);
          window.__timelines["beat-10"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

<!doctype html>
<html lang="de"><head><meta charset="UTF-8" /></head><body>
<template>
<style>
  /* HOOK — an either/or. The two names face off, each on its own side of a split field in its own
     colour, the hinge word in italic serif between them; the question then builds underneath.
     Notara is ink-blue, Kettlebrief orange, and those two colours carry through the whole reel so
     the viewer always knows whose beat it is. Frame 0 is the thumbnail: Notara is already there. */
  #root { --notara: #2440d8; --kettle: #e2562a; }
  #root .half { position: absolute; top: 0; bottom: 0; width: 50%; }
  #root .hl { left: 0; background: radial-gradient(80% 60% at 30% 40%, rgba(36,64,216,.13), transparent 70%); }
  #root .hr { right: 0; background: radial-gradient(80% 60% at 70% 60%, rgba(226,86,42,.14), transparent 70%); }
  #root .stage { position: absolute; inset: 0; }
  #root .n1, #root .n2 { position: absolute; font-size: 150px; font-weight: 700; letter-spacing: -0.055em; line-height: 1; }
  #root .n1 { left: 80px; top: 200px; color: var(--notara); }
  #root .n2 { right: 70px; top: 450px; color: var(--kettle); }
  #root .oder { position: absolute; left: 460px; width: 160px; top: 356px; text-align: center; font-size: 76px; line-height: 1; color: var(--muted); }
  #root .q { position: absolute; left: 110px; right: 110px; top: 650px; text-align: center; font-size: 50px; font-weight: 600; line-height: 1.22; letter-spacing: -0.03em; }
  #root .q em { color: var(--ink); font-size: 1.12em; }
  #root .seam { position: absolute; left: 540px; top: 120px; width: 2px; height: 480px; background: linear-gradient(transparent, rgba(18,18,18,.18), transparent); transform-origin: 50% 0; }
</style>
<div id="root" data-look="paper" data-composition-id="beat-00" data-width="1080" data-height="1080">
  <div class="half hl"></div><div class="half hr"></div>
  <div class="seam"></div>
  <div class="stage">
    <div class="n1">Notara</div>
    <div class="oder rc-serif">oder</div>
    <div class="n2">Kettlebrief?</div>
    <div class="q">Wenn du heute nur eine Notiz-App für deine Arbeit auswählen könntest, <em class="rc">welche</em> würdest du nehmen?</div>
  </div>
  <div class="rc-grain"></div>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  RC.blurIn(tl, "#root .n1", 0, { lead: true, x: -40, y: 0, blur: 14 });
  tl.fromTo("#root .seam", { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "expo.inOut" }, 0.05);
  RC.blurIn(tl, "#root .oder", 0.15, { blur: 10, y: 10 });
  // Kettlebrief arrives fast from the other side, smeared while it moves: the challenger.
  tl.fromTo("#root .n2", { x: 260, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 0.25);
  RC.smear(tl, "#root .n2", 0.25, { duration: 0.5, amount: 22 });
  // 20 words need 5.4s settled in a 6.67s beat: the question is in by ~1.1s.
  RC.words(tl, "#root .q", 0.45, { stagger: 0.028, blur: 10, y: 14, duration: 0.55 });
  RC.camera(tl, "#root .stage", 0, { duration: 6.6, to: { scale: 1.04 } });
  tl.fromTo("#root .hl", { opacity: 0.6 }, { opacity: 1, duration: 3, ease: "sine.inOut" }, 0);
  tl.fromTo("#root .hr", { opacity: 0.4 }, { opacity: 1, duration: 3, ease: "sine.inOut" }, 1.5);
  RC.hold(tl, 6.6);
  window.__timelines["beat-00"] = tl;
})();
</script>
</template>
</body></html>

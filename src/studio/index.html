async function crSend(first) {
  const ta = $("#cr-text"), text = ta.value;
  if (!text.trim() && !cr.files.length) return;
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {});
  const btn = $("#cr-send"); btn.disabled = true;
  const scripts = batchScripts();
  if (scripts.length >= 2) {
    try {
      const batch = `b_${Date.now().toString(36)}`;
      const startAt = cr.draft.startAt === "tonight" ? tonightAt1() : undefined;
      const others = cr.files.filter((f) => f.kind !== "script");
      const settings = Object.fromEntries(Object.entries(cr.draft.settings).filter(([, v]) => v));
      for (const sc of scripts) {
        const r = await post("/api/create", { title: sc.name.replace(/\.[a-z0-9]+$/i, ""), settings, model: cr.draft.model, effort: cr.draft.effort });
        const files = [await uploadFile(r.session.id, sc)];
        for (const f of others) files.push(await uploadFile(r.session.id, f));
        await post(`/api/create/${r.session.id}/queue`, { text, files, batch, startAt });
      }
      cr.files = []; cr.draft = { settings: {}, model: "", effort: "" };
      toast(`${scripts.length} reels queued${startAt ? " for tonight" : ""}`);
      await reloadCreateList(); renderLanding();
    } catch (e) { toast(e.message); btn.disabled = false; }
    return;
  }
  try {
    let id = cr.meta?.id;
    if (!id) { const r = await post("/api/create", { settings: Object.fromEntries(Object.entries(cr.draft.settings).filter(([, v]) => v)), model: cr.draft.model, effort: cr.draft.effort }); id = r.session.id; }

    ta.value = ""; cr.files = []; cr.draft = { settings: {}, model: "", effort: "" };
    if (!cr.meta) { location.hash = `#create/${id}`; return; }

  btn.disabled = false;
}

/**
 * Open a conversation at its latest message, and keep it there while images, frames and fonts settle, until the owner
 * scrolls. (The browser's own scroll restoration would put a reload back where the page used to be.)
 */
function pinToBottom(ms = 2500) {
  try { history.scrollRestoration = "manual"; } catch { /* old browser */ }
  const go = () => window.scrollTo(0, document.body.scrollHeight);
  go(); requestAnimationFrame(go);
  const box = $("#cr-events"); if (!box || !window.ResizeObserver) return;
  let stop = false;
  const quit = () => { stop = true; ro.disconnect(); ["wheel", "touchstart", "keydown", "pointerdown"].forEach((k) => window.removeEventListener(k, quit, true)); };
  const ro = new ResizeObserver(() => { if (!stop) go(); });
  ro.observe(box);
  ["wheel", "touchstart", "keydown", "pointerdown"].forEach((k) => window.addEventListener(k, quit, { capture: true, passive: true }));
  setTimeout(quit, ms);
}

  const tx = s.texture.scanlines > 0.3 ? "tx-scan" : s.texture.paper > 0.3 ? "tx-paper" : s.texture.grain > 0.25 ? "tx-grain" : "";
  const head = pair ? `font-family:${fam(pair.head)};font-weight:${pair.headWeight};text-transform:${pair.headCase || "none"}` : "";
  return `<div class="spec ${tx}" style="--g:${pal.ground};--i:${pal.ink};--a:${pal.accent};--a2:${pal.accent2}">
    ${prev ? `<video src="/files/style-preview/${s.id}-${kind}.mp4" poster="/files/style-preview/${s.id}-${kind}.jpg" muted loop playsinline autoplay preload="metadata"></video>` : `<div class="dots"><i></i><i></i></div>
    <div class="aa" style="${head}">Make it <em style="font-family:${pair ? fam(pair.accent) : "inherit"}">yours.</em></div>`}
  </div>`;
}

function pzFindings(step, style) {
  const list = pz.findings.filter((f) => f.step === step && (!style || !f.style || f.style === style));
  if (!list.length) return "";
  return `<div class="findings">${list.map((f, i) => `<div class="finding ${f.level}"><span class="ico">${f.level === "info" ? "i" : "!"}</span><div class="grow">${esc(f.message)}</div>${f.fix ? `<button class="sm" data-fix="${pz.findings.indexOf(f)}">${esc(f.fix.label)}</button>` : ""}</div>`).join("")}</div>`;
}
function bindFixes(root = $("#main")) {
  $$("[data-fix]", root).forEach((b) => b.addEventListener("click", () => {
    const f = pz.findings[Number(b.dataset.fix)]; if (!f?.fix) return;
    const { palette, font, styles } = f.fix.patch;
    if (palette) pz.p.palettes[palette.style] = palette.value;
    if (font) pz.p.fonts[font.style] = font.value;
    if (styles) setStyles(styles);
    pzChange(true);
  }));
}

function setStyles(ids) {
  const w = ids.length <= 1 ? [100] : ids.length === 2 ? [65, 35] : [55, 30, 15];
  pz.p.styles = ids.map((id, i) => ({ id, weight: pz.p.styles.find((s) => s.id === id && ids.length === pz.p.styles.length)?.weight ?? w[i] }));
  // Each beat kind to the chosen style that suits it best (the same rule the server uses).
  const beats = {};
  for (const [k] of BEATS) {
    let best, rank = 99;
    ids.forEach((id, o) => { const r = pzStyle(id).beats.indexOf(k); const sc = (r < 0 ? 10 : r) + o * 0.5; if (sc < rank) { rank = sc; best = id; } });
    if (best) beats[k] = best;
  }
  pz.p.beatStyles = beats;
  for (const k of Object.keys(pz.p.palettes)) if (!ids.includes(k)) delete pz.p.palettes[k];
  for (const k of Object.keys(pz.p.fonts)) if (!ids.includes(k)) delete pz.p.fonts[k];
}

/** Every change: the screen first, then a save in the background that brings back the findings. */
const pzSave = debounce(async () => {
  try {
    const r = await api(`/api/personalities/${pz.p.id}`, { method: "PUT", body: JSON.stringify(pz.p) });
    pz.findings = r.personality.findings;
    paintPzMeta();
  } catch (e) { toast(`Not saved: ${e.message}`); }
}, 350);
function pzChange(rerender) { if (rerender) renderPzStep(); else paintPzSummary(); pzSave(); }

function paintPzMeta() {
  // Warnings on the rail, the findings of this step, the summary.
  for (const [k] of PZ_STEPS) {
    const el = $(`.pz-step[data-step="${k}"] .w`); if (!el) continue;
    const fs = pz.findings.filter((f) => f.step === k && f.level !== "info");
    el.hidden = !fs.length; el.classList.toggle("err", fs.some((f) => f.level === "error"));
  }
  const box = $("#pz-findings"); if (box) { box.innerHTML = pzFindings(pz.step, pz.step === "colours" || pz.step === "fonts" ? pz.style : null); bindFixes(box); }
  paintPzSummary();
}

function pzSummaryHtml() {
  const p = pz.p, ch = pzChosen();
  const warn = pz.findings.filter((f) => f.level === "warn").length, err = pz.findings.filter((f) => f.level === "error").length;
  return `<h3>${esc(p.name)} ${p.isDefault ? `<span class="badge identity">Default</span>` : ""}</h3>
    <div><div class="lbl">Styles</div>${ch.length ? ch.map((s) => `<div class="row"><span class="grow">${esc(s.name)}</span><span class="tnum" style="color:var(--label-2)">${p.styles.find((x) => x.id === s.id).weight}%</span></div>`).join("") : `<div class="row" style="color:var(--label-2)">None yet</div>`}</div>
    ${ch.map((s) => { const pal = pzPalette(s), f = pzFont(s); return `<div><div class="lbl">${esc(s.name)}</div>
      <div class="row" style="margin-top:4px">${[pal.ground, pal.ink, pal.accent, pal.accent2].map((c) => `<i style="width:18px;height:18px;border-radius:50%;background:${c};box-shadow:inset 0 0 0 1px var(--sep)"></i>`).join("")}<span style="color:var(--label-2)">${esc(pal.name)}</span></div>
      ${f ? `<div class="row" style="font-family:${fam(f.head)};font-weight:${f.headWeight};font-size:17px">${esc(f.name)} <span style="font-family:${fam(f.accent)};font-style:italic;font-weight:400">Aa</span></div>` : ""}</div>`; }).join("")}
    <div><div class="lbl">Motion</div><div class="row">${esc(p.motion.energy)} · ${esc(p.motion.camera)} · ${esc(p.motion.overshoot)} overshoot</div></div>
    <div><div class="lbl">Checks</div><div class="row">${err ? `<span class="badge bad">${err} to fix</span>` : ""}${warn ? `<span class="badge warn">${warn} warning${warn > 1 ? "s" : ""}</span>` : ""}${!err && !warn ? `<span class="badge ok">All good</span>` : ""}</div></div>`;
}
function paintPzSummary() { const s = $("#pz-side"); if (s) s.innerHTML = pzSummaryHtml(); }

async function renderPersonality(id, step) {
  await loadPzCatalog();
  if (!id) return renderPzList();
  const r = await api(`/api/personalities/${id}`);
  pz.p = r.personality; pz.findings = r.personality.findings; delete pz.p.findings;
  pz.step = PZ_STEPS.some(([k]) => k === step) ? step : pz.p.styles.length ? "review" : "start";
  if (!pz.style || !pz.p.styles.some((s) => s.id === pz.style)) pz.style = pz.p.styles[0]?.id || null;
  const i = PZ_STEPS.findIndex(([k]) => k === pz.step);
  $("#main").innerHTML = `${pageHead(esc(pz.p.name), { back: `<a class="back" href="#personality">${ic("back", 18)}Personalities</a>`,
      actions: `<button class="pz-sumbtn" id="pz-sum">Summary</button><button id="pz-rename">Rename</button>${pz.p.isDefault ? "" : `<button id="pz-def">Make default</button>`}` })}
    <div class="pz">
      <nav class="pz-rail" aria-label="Steps">${PZ_STEPS.map(([k, l], n) => `<a class="pz-step ${k === pz.step ? "on" : ""} ${pz.p.done.includes(k) ? "done" : ""}" data-step="${k}" href="#personality/${id}/${k}"><span class="k">${pz.p.done.includes(k) ? ic("check", 11) : ""}</span><span>${l}</span><span class="w" hidden></span></a>`).join("")}</nav>
      <section class="pz-main"><div class="pz-prog">${PZ_STEPS.map(([k], n) => `<i class="${n === i ? "on" : pz.p.done.includes(k) ? "done" : ""}"></i>`).join("")}</div>
        <div id="pz-step"></div>
        <div class="pz-foot liquid-glass liquid-glass-milky">${i > 0 ? `<button id="pz-back">Back</button>` : `<span></span>`}<span class="note">${i + 1} of ${PZ_STEPS.length}</span>${i < PZ_STEPS.length - 1 ? `<button class="primary" id="pz-next">Next</button>` : `<button class="primary" id="pz-finish">Finish</button>`}</div></section>
      <aside class="pz-side" id="pz-side"></aside>
    </div>`;
  const go = (k) => { location.hash = `#personality/${id}/${k}`; };
  $("#pz-back")?.addEventListener("click", () => go(PZ_STEPS[i - 1][0]));
  $("#pz-next")?.addEventListener("click", () => { if (!pz.p.done.includes(pz.step)) { pz.p.done.push(pz.step); pzSave(); } go(PZ_STEPS[i + 1][0]); });
  $("#pz-finish")?.addEventListener("click", finishPz);
  $("#pz-sum").addEventListener("click", () => openSheet({ title: "Summary", body: `<div class="pz-side" style="position:static;padding:0">${pzSummaryHtml()}</div>` }));
  $("#pz-rename").addEventListener("click", async () => { const v = await askText({ title: "Rename", value: pz.p.name }); if (v) { pz.p.name = v; pzSave(); $(".phead h1").textContent = v; } });
  $("#pz-def")?.addEventListener("click", async () => { await post(`/api/personalities/${id}/default`); toast("This personality is now used for every new reel."); route(); });
  renderPzStep();
}

async function finishPz() {
  await new Promise((r) => setTimeout(r, 400));
  try {
    const r = await post(`/api/personalities/${pz.p.id}/finish`);
    pz.p = r.personality; pz.findings = r.personality.findings; delete pz.p.findings;
    toast(pz.p.isDefault ? "Saved. Every new reel uses it." : "Saved. Make it the default to use it for every reel.");
    location.hash = "#personality";
  } catch (e) { toast("Fix the red findings first"); location.hash = `#personality/${pz.p.id}/colours`; }
}

  on("[data-w]", "input", (e) => { const st = p.styles.find((x) => x.id === e.target.dataset.w); st.weight = Number(e.target.value); $(`#w-${st.id}`).textContent = `${st.weight}%`; pzChange(false); });
  BEATS.forEach(([k]) => bindSeg(`pzb-${k}`, (v) => { p.beatStyles[k] = v; pzChange(false); }));
  on(".pal", "click", (e) => { p.palettes[cur.id] = JSON.parse(e.currentTarget.dataset.pal); pzChange(true); });
  on("[data-pk]", "input", debounce((e) => { const base = { ...pzPalette(cur) }; p.palettes[cur.id] = { ...base, id: "custom", name: "Custom", [e.target.dataset.pk]: e.target.value }; pzChange(true); }, 120));
  on(".fcard", "click", (e) => { p.fonts[cur.id] = e.currentTarget.dataset.font; pzChange(true); });
  on("#pz-tx-style", "change", (e) => { p.texture.useStyle = e.target.checked; pzChange(true); });
  on("[data-tx]", "input", (e) => { p.texture[e.target.dataset.tx] = Number(e.target.value) / 100; e.target.nextElementSibling.textContent = e.target.value; pzChange(false); });
  on("#pz-tag", "input", (e) => { p.signature.tagline = e.target.value; pzChange(false); });
  on("#pz-bpm0, #pz-bpm1", "change", () => { const a = Number($("#pz-bpm0").value), b = Number($("#pz-bpm1").value); p.sound.bpm = [Math.min(a, b), Math.max(a, b)]; pzChange(false); });

  on("#pz-hold", "input", (e) => { p.pacing.payoffHold = Number(e.target.value) / 10; $("#pz-hold-v").textContent = `${p.pacing.payoffHold.toFixed(1)} s`; pzChange(false); });
  on("#pz-ban", "change", (e) => { p.guardrails.bannedColors.push(e.target.value); pzChange(true); });
  on("[data-unban]", "click", (e) => { p.guardrails.bannedColors.splice(Number(e.currentTarget.dataset.unban), 1); pzChange(true); });
  on("#pz-banf", "change", (e) => { if (e.target.value && !p.guardrails.bannedFonts.includes(e.target.value)) p.guardrails.bannedFonts.push(e.target.value); pzChange(true); });
  on("[data-unbanf]", "click", (e) => { p.guardrails.bannedFonts.splice(Number(e.currentTarget.dataset.unbanf), 1); pzChange(true); });
  on("#pz-maxf", "change", (e) => { p.guardrails.maxFonts = Math.max(1, Math.min(4, Number(e.target.value) || 3)); pzChange(false); });
  on("[data-g]", "change", (e) => { p.guardrails[e.target.dataset.g] = e.target.checked; pzChange(false); });
  on("#pz-notes", "input", (e) => { p.guardrails.notes = e.target.value; pzChange(false); });
  on("#pz-mini", "click", async (e) => {
    e.target.disabled = true;
    try { await post(`/api/personalities/${p.id}/render`); toast("Rendering your mini beats. They appear here when done."); pollMini(); }
    catch (err) { toast(err.message); e.target.disabled = false; }
  });
  if (pz.step === "review") paintMini();

}

/** The owner's own mini beats, on the Review step: what is rendered, and a running render's progress. */
async function paintMini() {
  const box = $("#pz-minis"); if (!box) return;
  const r = await api(`/api/personalities/${pz.p.id}/renders`);
  const running = r.job && r.job.status === "running";
  box.innerHTML = r.renders.length ? `<div class="st-grid" style="margin-top:12px">${r.renders.map((x) => `<div class="st-card"><div class="spec"><video src="${x.video}?t=${Date.parse(x.at)}" poster="${x.poster}?t=${Date.parse(x.at)}" muted loop playsinline autoplay></video></div><div class="meta"><div class="name">${esc(pzStyle(x.style)?.name || x.style)}</div><div class="sub">Rendered ${esc(when(x.at))}</div></div></div>`).join("")}</div>` : "";
  if (running) box.insertAdjacentHTML("afterbegin", `<p class="foot-note">Rendering… ${esc(r.job.log.at(-1) || "")}</p>`);
  const btn = $("#pz-mini"); if (btn) btn.disabled = running || btn.disabled;
  if (r.job?.status === "failed") box.insertAdjacentHTML("afterbegin", `<p class="foot-note" style="color:var(--red)">The last render failed: ${esc(r.job.log.slice(-2).join(" "))}</p>`);
  return running;
}
async function pollMini() { clearTimeout(pollMini.t); if (await paintMini()) pollMini.t = setTimeout(pollMini, 2500); }

async function refreshBrandPals() {
  pz.brandPals = pz.p.brand.colors.length ? (await post("/api/personality/brand", { colors: pz.p.brand.colors })).palettes : null;

async function pzRoll() {
  const p = pz.p;
  const locks = {};
  if (pz.locks.styles && p.styles.length) locks.styles = p.styles.map((s) => s.id);
  if (pz.locks.palettes) locks.palettes = { ...p.palettes };
  if (pz.locks.fonts) locks.fonts = { ...p.fonts };
  if (locks.styles) locks.count = p.styles.length;
  const r = await post("/api/personality/surprise", { locks });
  p.styles = r.roll.styles; p.beatStyles = r.roll.beatStyles; p.palettes = r.roll.palettes; p.fonts = r.roll.fonts;
  pz.style = p.styles[0]?.id || null;
  pzChange(true);
  openSheet({ title: "Surprise", sub: `${p.styles.map((s) => pzStyle(s.id).name).join(" + ")}. Lock what you like and roll again.`,
    body: `<div class="st-grid" style="margin-bottom:12px">${pzChosen().map((s) => `<div class="st-card">${specimen(s, pzPalette(s), pzFont(s))}<div class="meta"><div class="name">${esc(s.name)}</div><div class="sub">${esc(pzPalette(s).name)} · ${esc(pzFont(s)?.name || "")}</div></div></div>`).join("")}</div>
      <div class="group">${[["styles", "Styles"], ["palettes", "Colours"], ["fonts", "Fonts"]].map(([k, l]) => `<div class="row-i"><span class="t grow">Lock ${l.toLowerCase()}</span><input type="checkbox" class="switch" data-lock="${k}" ${pz.locks[k] ? "checked" : ""}></div>`).join("")}</div>
      <div class="acts"><button data-sclose>Keep this</button><button class="primary" id="pz-again">${ic("dice", 16)} Roll again</button></div>`,
    bind: (sh) => { $$("[data-lock]", sh).forEach((c) => c.addEventListener("change", () => { pz.locks[c.dataset.lock] = c.checked; })); $("#pz-again", sh).addEventListener("click", () => { closeSheet(); pzRoll(); }); } });
}

// ---------- library
async function loadLibrary() {
  const tags = [...state.tagFilter].join(",");
  const [a, t] = await Promise.all([api(`/api/assets?tags=${encodeURIComponent(tags)}&q=${encodeURIComponent(state.q)}&type=${state.type}`), api("/api/tags")]);
  state.assets = a.assets; state.counts = a.counts; state.tags = t.tags;
}
function addMenu(btn) {
  openMenu(btn, [
    { label: "Choose files…", act: () => $("#in-files").click() },
    { label: "Choose a folder…", act: () => $("#in-folder").click() },
    { sep: true }, { cap: "What you add next" },
    { label: "Real brand marks or product screens", check: state.dropKind === "identity", keep: true, act: () => { state.dropKind = state.dropKind === "identity" ? "generic" : "identity"; } },
    { label: "Private (never shown to Claude)", check: state.dropPrivate, keep: true, act: () => { state.dropPrivate = !state.dropPrivate; } },
  ]);
}
function renderLibrary() {
  const sel = state.assets.find((a) => a.id === state.selected);
  const tagCount = Object.keys(state.tags).length;
  $("#main").innerHTML = `
    ${pageHead("Library", { actions: `<label class="search">${ic("search", 15)}<input type="search" id="q" placeholder="Search" aria-label="Search names, tags, descriptions and sources" value="${esc(state.q)}"></label><button class="primary" id="add">${ic("plus", 16)}Add</button>` })}
    <div class="bar">${segHtml("types", TYPES.map(([v, l]) => [v, v === "audio" && state.counts.audio ? `${l} <span class="n">${state.counts.audio}</span>` : l]), state.type)}
      ${tagCount ? `<button id="tags">${ic("tag", 15)}Tags${state.tagFilter.size ? ` · ${state.tagFilter.size}` : ""}${ic("down", 14)}</button>` : ""}</div>
    ${state.tagFilter.size ? `<div class="active-tags">${[...state.tagFilter].map((t) => `<span class="chip on" data-untag="${esc(t)}" role="button" tabindex="0" title="Remove this filter">#${esc(t)} ${ic("x", 12)}</span>`).join("")}</div>` : ""}
    <div class="uploads group" id="uploads"></div>
    <div class="${sel ? "split" : ""}">
      <div>${state.assets.length === 0 ? emptyLibrary() : `<div class="grid">${state.assets.map(assetCard).join("")}</div>`}</div>
      ${sel ? `<div class="scrim" data-close-panel></div>${assetPanel(sel)}` : ""}
    </div>`;
  renderUploads();
  bindSeg("types", async (v) => { state.type = v; await loadLibrary(); renderLibrary(); });
  $("#add").addEventListener("click", (e) => addMenu(e.currentTarget));
  $("#empty-add")?.addEventListener("click", (e) => addMenu(e.currentTarget));
  $("#tags")?.addEventListener("click", (e) => {
    const entries = Object.entries(state.tags).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 60);
    openMenu(e.currentTarget, [...(state.tagFilter.size ? [{ label: "Clear all tags", act: async () => { state.tagFilter.clear(); await loadLibrary(); renderLibrary(); } }, { sep: true }] : []),
      ...entries.map(([t, n]) => ({ label: `#${t}`, n, check: state.tagFilter.has(t), act: async () => { state.tagFilter.has(t) ? state.tagFilter.delete(t) : state.tagFilter.add(t); await loadLibrary(); renderLibrary(); } }))]);
  });
  $$("[data-untag]").forEach((el) => el.addEventListener("click", async () => { state.tagFilter.delete(el.dataset.untag); await loadLibrary(); renderLibrary(); }));
  $("#q").addEventListener("input", debounce(async (e) => { state.q = e.target.value; await loadLibrary(); renderLibrary(); const q = $("#q"); q.focus(); q.setSelectionRange(state.q.length, state.q.length); }, 200));
  $$("[data-asset]").forEach((el) => el.addEventListener("click", () => { state.selected = state.selected === el.dataset.asset ? null : el.dataset.asset; renderLibrary(); }));
  if (sel) bindPanel(sel);
}
function emptyLibrary() {
  if (state.tagFilter.size || state.q || state.type) return emptyState("search", "Nothing matches", "Try another search, or clear the type and tag filters.");
  return emptyState("library", "The library is empty", "Drop files or whole folders anywhere on this window, or watch a folder so new files come in by themselves.", `<button class="primary" id="empty-add">${ic("plus", 16)}Add files</button><a href="#folders"><button>Watch a folder</button></a>`);
}
function assetCard(a) {
  return `<div class="card ${a.id === state.selected ? "sel" : ""}" data-asset="${a.id}" role="button" tabindex="0" aria-pressed="${a.id === state.selected}">
    <div class="thumb ${a.mediaType === "audio" ? "wave" : ""}">${preview(a)}</div>
    <div class="meta">
      <div class="name" title="${esc(a.name)}">${esc(a.name)}</div>
      <div class="sub">${a.assetKind === "identity" ? `<span class="badge identity">identity</span>` : ""}${a.review.state !== "approved" ? `<span class="badge ${a.review.state}">${a.review.state}</span>` : ""}${a.queued ? `<span class="badge queued">needs Claude</span>` : ""}${a.analysis && a.analysis.music ? `<span class="badge" title="${esc(a.analysis.music.mood.join(", "))}">♪ ${Math.round(a.analysis.music.bpm)} BPM</span>` : ""}${a.provenance && a.provenance.source === "generated" ? `<span class="badge warn" title="Made by a model, not recorded">AI-generated</span>` : ""}${a.status !== "active" ? `<span class="badge ${a.status}">${a.status}</span>` : ""}${tagHtml(a, 3)}</div>
    </div>
  </div>`;
}
function analysisRows(a) {
  const x = a.analysis || {}, rows = [];
  if (x.width) rows.push(["Size", `${x.width} × ${x.height}`]);
  if (x.durationSeconds != null) rows.push(["Length", dur(x.durationSeconds)]);
  if (x.peakDb != null) rows.push(["Level", `peak ${x.peakDb} dB · loudness ${x.lufs} · gain ${x.gainDb > 0 ? "+" : ""}${x.gainDb} dB when mixed`]);
  if (x.descriptors?.length) rows.push(["Shape", x.descriptors.join(", ")]);
  if (x.dominantColors?.length) rows.push(["Colours", `<span class="swatches">${x.dominantColors.map((c) => `<i style="background:${esc(c)}" title="${esc(c)}"></i>`).join("")}</span>`]);
  if (x.text) rows.push(["Text in file", esc(x.text)]);
  if (x.description) rows.push(["Claude says", esc(x.description)]);
  return rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
}
function panelClose(id) { return `<button class="icon closer-disc" id="${id}" data-close aria-label="Close" title="Close (Esc)">${ic("x", 16)}</button>`; }
function assetPanel(a) {
  const p = a.provenance, ref = `assets/library/${a.file.split("/").pop()}`;
  return `<aside class="panel" aria-label="Asset details">
    ${panelClose("close")}

const MAX_PARALLEL = 3;
$("#in-files").addEventListener("change", (e) => { enqueue([...e.target.files].map((file) => ({ file, rel: "" }))); e.target.value = ""; });
$("#in-folder").addEventListener("change", (e) => { enqueue([...e.target.files].map((file) => ({ file, rel: (file.webkitRelativePath || "").split("/").slice(0, -1).join("/") }))); e.target.value = ""; });
let dragDepth = 0;
const dropTarget = () => (state.tab === "references" ? "references" : state.tab === "library" || state.tab === "footage" || state.tab === "review" ? "library" : null);
window.addEventListener("dragenter", (e) => {
  if (![...(e.dataTransfer?.types || [])].includes("Files") || !dropTarget()) return;
  dragDepth++; $("#dropzone-t").textContent = dropTarget() === "references" ? "Drop to add references" : "Drop to add to the library"; $("#dropzone").classList.add("on");
});
window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("#dropzone").classList.remove("on"); });

window.addEventListener("drop", async (e) => {

});
async function filesFromDrop(dt) {

    const reader = entry.createReader(); let batch;
    do { batch = await new Promise((res, rej) => reader.readEntries(res, rej)); for (const child of batch) await walk(child, dir ? `${dir}/${entry.name}` : entry.name); } while (batch.length);
  };

}
function enqueue(items) {
  const batch = items.filter((i) => !i.file.name.startsWith(".")).map((i) => ({ ...i, id: Math.random().toString(36).slice(2), progress: 0, status: "queued", note: "", kind: state.dropKind, private: state.dropPrivate }));

}
let running = 0;
function pump() {

  }

function send(u) {

    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload");
    xhr.setRequestHeader("x-reelcut-name", encodeURIComponent(u.file.name));
    if (u.rel) xhr.setRequestHeader("x-reelcut-path", encodeURIComponent(u.rel));
    xhr.setRequestHeader("x-reelcut-kind", u.kind);
    if (u.private) xhr.setRequestHeader("x-reelcut-private", "1");
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) { u.progress = e.loaded / e.total; renderUploads(); } };

      let body = {}; try { body = JSON.parse(xhr.responseText); } catch {}

async function finishUploads() {

// ---------- green screens: detected on ingest, keyed to a transparent copy in the background
function keyBadge(a) {

}

  const busy = k.state === "queued" || k.state === "running";
  const status = !k.wanted ? "Used as recorded, green and all." : busy ? "Keying in the background… the preview updates when it is done." : k.keyed ? "Keyed. The original is untouched; the copy is saved and reused." : k.error ? `Could not key it: ${esc(k.error)}` : "Not keyed yet.";

  return `<div class="cap">Green screen</div>
  <div class="group">
    <div class="form-row"><div class="col grow"><span class="t">Remove the green screen</span><span class="s">${status}</span></div><input type="checkbox" class="switch" data-k="enabled" aria-label="Remove the green screen" ${key.enabled ? "checked" : ""}></div>
    ${a.keyedUrl ? `<div class="form-row"><span class="grow s">Preview</span>${segHtml("key-view", [["orig", "Original"], ["keyed", "Keyed"]], "orig")}</div>` : ""}
    ${key.enabled ? `<div style="padding:6px 0">${range("tolerance", 0, 0.3, 0.01, "Tolerance", "How much green still counts as backdrop. Raise it if green specks remain; lower it if the subject's edges thin out.")}${range("softness", 0, 1, 0.05, "Softness", "1 keeps the anti-aliased edge; 0 cuts a hard edge.")}${range("despill", 0, 1, 0.05, "Despill", "How much green is taken out of the edges.")}</div>
    <div class="form-row"><label for="k-shadows" class="grow">Shadows</label><select id="k-shadows" data-k="shadows" style="flex:0 0 auto"><option value="keep" ${key.shadows === "keep" ? "selected" : ""}>Keep as a soft shadow</option><option value="drop" ${key.shadows === "drop" ? "selected" : ""}>Remove</option></select></div>
    <div class="form-row" title="Eat into the edge by this many pixels, for a stubborn halo"><label for="k-choke" class="grow">Edge choke</label><select id="k-choke" data-k="choke" style="flex:0 0 auto">${[0, 1, 2, 3].map((v) => `<option value="${v}" ${v === key.choke ? "selected" : ""}>${v} px</option>`).join("")}</select></div>

function bindKey(a, run) {

function footagePanel(a) {

    <p class="lede">Motion-graphics films you admire. reelcut measures how they cut and look; the moves come from tags Claude suggests and you accept. When three agree, a rule is proposed in <a href="#learnings">Learnings</a>. The films stay on this computer and are never used in a reel.</p>
    <div class="uploads group" id="r-up"></div>
    ${state.rcounts.queue ? `<div class="group" style="margin-bottom:20px"><div class="row-i"><span class="tile" style="background:var(--orange)">${ic("learnings", 16)}</span><div class="col"><span class="t">${state.rcounts.queue} still need Claude to look at them</span><span class="s">Run <code>${esc(state.rcommand)}</code> in Claude Code</span></div><button class="sm" id="r-copy">Copy</button></div></div>` : ""}
    ${taughtPanel()}
    <div class="${sel ? "split" : ""}">
      <div>${state.refs.length === 0 ? emptyState("references", "No references yet", "Drop a few films you admire anywhere on this window, or run <code>npm run references -- add film.mp4</code>.") : `<div class="grid">${state.refs.map(refCard).join("")}</div>`}</div>
      ${sel ? `<div class="scrim" data-close-panel></div>${refPanel(sel)}` : ""}
    </div>`;
  renderRefUploads();
  $("#r-add").addEventListener("click", (e) => openMenu(e.currentTarget, [{ label: "Choose videos…", act: () => $("#r-in").click() }, { label: "Choose a folder…", act: () => $("#r-indir").click() }]));
  $("#r-copy")?.addEventListener("click", () => { navigator.clipboard?.writeText(state.rcommand); toast("Command copied"); });
  $$("[data-ref]").forEach((el) => el.addEventListener("click", () => { state.rsel = state.rsel === el.dataset.ref ? null : el.dataset.ref; renderReferences(); }));
  if (sel) bindRef(sel);
}
function renderRefUploads() { const el = $("#r-up"); if (el) el.innerHTML = state.ruploads.map((u) => `<div class="row-i"><span>${esc(u.name)}</span><span class="s">${u.status}</span><span class="s">${esc(u.detail || "")}</span></div>`).join(""); }
function addRefs(files) { for (const f of files) if (/^video\//.test(f.type) || /\.(mp4|mov|webm|mkv|m4v)$/i.test(f.name)) state.ruploads.push({ name: f.name, file: f, status: "waiting" }); renderRefUploads(); pumpRefs(); }
$("#r-in").addEventListener("change", (e) => { addRefs([...e.target.files]); e.target.value = ""; });
$("#r-indir").addEventListener("change", (e) => { addRefs([...e.target.files]); e.target.value = ""; });
let refBusy = 0;
function pumpRefs() {
  while (refBusy < 2) {
    const u = state.ruploads.find((x) => x.status === "waiting"); if (!u) break;
    u.status = "measuring…"; refBusy++; renderRefUploads();
    fetch("/api/references/upload", { method: "POST", headers: { "x-reelcut-name": encodeURIComponent(u.name) }, body: u.file })
      .then(async (res) => { const b = await res.json().catch(() => ({})); u.status = b.outcome ? b.outcome.state : "failed"; u.detail = (b.outcome && b.outcome.reason) || b.error || ""; })
      .catch((e) => { u.status = "failed"; u.detail = e.message; })
      .finally(async () => { refBusy--; renderRefUploads(); if (!state.ruploads.some((x) => x.status === "waiting" || x.status === "measuring…")) { state.ruploads = state.ruploads.filter((x) => x.status === "failed"); await updateBadges(); if (state.tab === "references") renderReferences(); } else pumpRefs(); });
  }
}
function bindRef(r) {
  const edit = async (body, msg) => { try { await patch(`/api/references/${r.id}`, body); toast(msg); await updateBadges(); renderReferences(); } catch (e) { toast(e.message); } };
  $("#r-close").addEventListener("click", () => { state.rsel = null; renderReferences(); });
  $("#r-inc").addEventListener("change", (e) => edit({ include: e.target.checked }, e.target.checked ? "Teaching from it" : "Switched off"));
  $$("[data-mv]").forEach((el) => el.addEventListener("click", () => el.classList.toggle("on")));
  const body = () => ({ moves: $$("[data-mv].on").map((c) => c.dataset.mv), ...($("#r-text").value ? { textStyle: $("#r-text").value } : {}), note: $("#r-note").value });
  $("#r-save").addEventListener("click", () => edit(body(), "Tags saved"));
  $("#r-accept")?.addEventListener("click", () => edit({ accept: true }, "Accepted"));
  $("#r-del").addEventListener("click", async () => {
    if (!(await ask({ title: "Delete this reference?", detail: "What it taught goes with it.", ok: "Delete", danger: true }))) return;
    try { await api(`/api/references/${r.id}`, { method: "DELETE" }); state.rsel = null; toast("Deleted"); await updateBadges(); renderReferences(); } catch (e) { toast(e.message); }
  });
}

// ---------- shell
let poll;
function setCount(name, v) { $$(`[data-count="${name}"]`).forEach((el) => { el.textContent = v || ""; }); }
async function updateBadges() {
  try {
    const [lib, folders, learn] = await Promise.all([api("/api/assets?limit=0"), api("/api/folders"), api("/api/learnings")]);
    state.counts = lib.counts; state.folders = folders.folders; state.learn = learn;
  } catch { return; }
  setCount("library", state.counts.all);
  setCount("review", state.counts.pending);
  setCount("footage", state.counts.footage);
  try { const rr = await api("/api/references"); state.rcounts = rr.counts; setCount("references", rr.counts.all); } catch { /* the page still works */ }
  setCount("folders", state.folders.length);
  const waiting = (state.learn?.rules || []).filter((r) => r.status === "proposed" && !r.conflictWith.length).length;
  setCount("learnings", waiting);
  setCount("reels", state.runs.length);
  try { await loadPatterns(); setCount("patterns", state.patterns.length); } catch { /* the page still works */ }
  try { await loadPackSounds(); setCount("sounds", state.packSounds.length); } catch { /* the page still works */ }
  setCount("jobs", state.jobs.filter((j) => j.status === "running").length ? "●" : "");
  setCount("more", (state.counts.pending || 0) + waiting || "");
}
const TAB_INDEX = { create: 0, library: 1, reels: 2 };
function skeleton(title) { $("#main").innerHTML = `${pageHead(title)}<div class="grid" aria-busy="true">${Array.from({ length: 8 }, () => `<div class="skel card"></div>`).join("")}</div>`; }
async function route() {
  const [tab, id, sub] = (location.hash.slice(1) || "library").split("/");
  if (tab === "more") { history.replaceState(null, "", `#${state.tab}`); openMore(); return; }
  const changed = tab !== state.tab;
  state.tab = tab;
  closeMenu(); closeSheet();
  if (tab !== "create") { cr.es?.close(); cr.es = null; clearInterval(cr.tick); clearTimeout(cr.reelTimer); }
  $$("[data-tab]").forEach((a) => { const on = a.dataset.tab === tab; a.classList.toggle("on", on); if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  $("#tabbar").style.setProperty("--i", TAB_INDEX[tab] ?? 3);
  clearTimeout(poll);
  const slow = setTimeout(() => skeleton(tab[0].toUpperCase() + tab.slice(1)), 150);
  try {
    await Promise.all([loadRuns(), loadJobs(), loadIngest()]);
    await updateBadges();
    if (tab === "reels" && id) await renderReel(id);
    else if (tab === "reels") renderReels();
    else if (tab === "jobs") renderJobs();
    else if (tab === "footage") await renderFootage();
    else if (tab === "references") await renderReferences();
    else if (tab === "review") await renderReview();
    else if (tab === "folders") await renderFolders();
    else if (tab === "learnings") await renderLearnings();
    else if (tab === "patterns") { await loadPatterns(); renderPatterns(); }
    else if (tab === "sounds") { await loadPackSounds(); renderSounds(); }
    else if (tab === "personality") await renderPersonality(id, sub);
    else if (tab === "create") { if (id && sub) cr.panelView = sub; await renderCreate(id); }
    else if (tab === "performance") await renderPerformance();
    else { await loadLibrary(); renderLibrary(); }
  } catch (e) { $("#main").innerHTML = `${pageHead("Something went wrong")}${emptyState("x", "This page could not load", esc(e.message), `<button class="primary" id="retry">Retry</button>`)}`; $("#retry")?.addEventListener("click", route); }
  clearTimeout(slow);
  // A conversation opens at its latest message (pinToBottom); every other page opens at its top.
  if (changed) { const m = $("#main"); m.classList.remove("enter"); void m.offsetWidth; m.classList.add("enter"); if (tab === "create" && id) pinToBottom(); else window.scrollTo(0, 0); }
  afterRender();
  if (tab === "jobs" && state.jobs.some((j) => j.status === "running")) poll = setTimeout(route, 2000);
}
// After every render: the inspector's scrim, the header's hairline, the phone's inline title.
let titleIO;
// Pages re-render themselves (a click on a card, a save), so the bindings below follow every change to #main.
new MutationObserver(() => { queueMicrotask(afterRender); }).observe(document.getElementById("main"), { childList: true });
function afterRender() {
  $$("[data-close-panel]:not([data-bound])").forEach((s) => { s.dataset.bound = "1"; s.addEventListener("click", () => $(".panel [data-close]")?.click()); });
  const h1 = $(".phead h1"), head = $(".phead");
  if (!h1 || h1 === afterRender.h1) return;
  afterRender.h1 = h1;
  titleIO?.disconnect();
  titleIO = new IntersectionObserver(([e]) => {
    const scrolled = !e.isIntersecting;
    $("#topbar").dataset.scrolled = String(scrolled);
    if (head) head.dataset.scrolled = String(window.scrollY > 4);
  }, { rootMargin: "-44px 0px 0px 0px" });
  titleIO.observe(h1);
}
// The phone tab bar shrinks while scrolling down, and comes back on the way up or near the top.
let lastY = 0;
window.addEventListener("scroll", () => {
  const y = window.scrollY, bar = $("#tabbar"), head = $(".phead");
  if (head) head.dataset.scrolled = String(y > 4);
  if (y < 40) bar.classList.remove("min"); else if (y - lastY > 8) bar.classList.add("min"); else if (lastY - y > 8) bar.classList.remove("min");
  if (Math.abs(y - lastY) > 8 || y < 40) lastY = y;
}, { passive: true });
$("#tabbar").addEventListener("click", (e) => { if (e.target.closest("a")) $("#tabbar").classList.remove("min"); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (menuEl) return closeMenu(); if (sheetClose) return closeSheet(); const c = $(".panel [data-close]"); if (c && !e.target.closest("input, textarea, select")) c.click(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "b") { e.preventDefault(); setRail(document.documentElement.dataset.rail !== "1"); }
  if (e.key === "/" && !e.target.closest("input, textarea, select") && $("#q")) { e.preventDefault(); $("#q").focus(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".card[role=button], .chip[role=button]")) { e.preventDefault(); e.target.click(); }
});
$("#rail").innerHTML = ic("rail", 16);
$("#settings").innerHTML = ic("settings", 17);
paintIcons();
window.addEventListener("hashchange", route);
route();
</script>
</body>

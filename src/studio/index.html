<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>reelcut studio</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #16161a; --muted: #67665f; --line: #e2dfd9;
    --accent: #c2410c; --ok: #1f7a46; --warn: #a96a12; --bad: #b3372a; --chip: #ece8e1;
    color-scheme: light dark; --radius: 10px; --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --panel: #1a1a1d; --ink: #eceae6; --muted: #9a9894; --line: #2a2a2e; --chip: #26262a; --ok: #3fbf74; --warn: #e0a84a; --bad: #ef6b5b; --accent: #ff7a4d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 20px; padding: 12px 24px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: -0.01em; }
  header h1 span { color: var(--accent); }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 999px; }
  nav a.on { background: var(--ink); color: var(--bg); }
  nav a .n { font-variant-numeric: tabular-nums; opacity: .75; margin-left: 4px; }
  .sync { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .dot.busy { background: var(--warn); } .dot.off { background: var(--bad); }
  main { padding: 20px 24px 60px; max-width: 1400px; margin: 0 auto; }
  h2.sec { font-size: 15px; margin: 22px 0 10px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  input[type=search] { min-width: 240px; }
  input[type=checkbox] { padding: 0; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 12px; }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; background: var(--chip); color: var(--ink); border: 1px solid transparent; cursor: pointer; user-select: none; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: border-color .15s; position: relative; }
  .card:hover { border-color: var(--muted); }
  .card.sel { border-color: var(--accent); }
  .card .pick { position: absolute; left: 8px; top: 8px; z-index: 2; width: 18px; height: 18px; }
  .thumb { aspect-ratio: 1 / 1; background: repeating-conic-gradient(var(--chip) 0 25%, transparent 0 50%) 0 0 / 16px 16px; display: grid; place-items: center; overflow: hidden; }
  .thumb img, .thumb video { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .thumb .ext { font: 600 22px var(--mono); color: var(--muted); text-transform: uppercase; }
  .thumb.wave { aspect-ratio: 3 / 1; }
  .meta { padding: 10px 12px; }
  .meta .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .sub { color: var(--muted); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--chip); color: var(--muted); }
  .badge.identity { color: var(--accent); }
  .badge.superseded, .badge.retired, .badge.missing, .badge.rejected, .badge.failed { color: var(--bad); }
  .badge.ok, .badge.approved { color: var(--ok); }
  .badge.running, .badge.pending, .badge.queued, .badge.proposed { color: var(--warn); }
  .split { display: grid; grid-template-columns: 1fr 390px; gap: 20px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; }
  .panel h2 { font-size: 16px; margin: 0 0 12px; word-break: break-word; }
  .panel .preview { margin-bottom: 12px; }
  .panel audio { width: 100%; margin-bottom: 12px; }
  dl { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; margin: 0 0 14px; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; word-break: break-word; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  label + input, label + select, label + textarea { width: 100%; }
  label.inline select, label.inline input:not([type=checkbox]) { width: auto; }
  label.inline { display: inline-flex; align-items: center; gap: 6px; margin: 0; color: var(--ink); font-size: 13px; }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  .ref { display: flex; gap: 6px; align-items: center; background: var(--chip); padding: 6px 8px; border-radius: 6px; margin-bottom: 12px; }
  .ref code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .empty code { background: var(--chip); padding: 2px 6px; border-radius: 4px; }
  .note { color: var(--muted); font-size: 13px; }
  .swatches { display: flex; gap: 6px; } .swatches i { width: 18px; height: 18px; border-radius: 4px; display: inline-block; border: 1px solid var(--line); }
  .tag.auto { font-style: italic; color: var(--muted); }
  .drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 18px; text-align: center; color: var(--muted); margin-bottom: 16px; background: var(--panel); transition: border-color .15s, background .15s; }
  .drop.over { border-color: var(--accent); background: var(--chip); color: var(--ink); }
  .drop .row { justify-content: center; margin-top: 10px; }
  .uploads { margin: -4px 0 16px; font-size: 13px; }
  .uploads .u { display: grid; grid-template-columns: 1fr 90px 160px; gap: 10px; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--line); }
  progress { width: 100%; height: 6px; }
  .reel-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .reel-head h2 { margin: 0; font-size: 18px; }
  .master { background: #000; border-radius: var(--radius); overflow: hidden; margin-bottom: 18px; display: grid; place-items: center; }
  .master video { max-width: 100%; max-height: 70vh; display: block; }
  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .clip { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .clip video { width: 100%; display: block; background: #000; aspect-ratio: 1/1; object-fit: contain; }
  .clip .meta { display: flex; flex-direction: column; gap: 8px; }
  .clip .meta .top { display: flex; justify-content: space-between; align-items: center; }
  .clip .fb { display: flex; gap: 6px; align-items: center; }
  .clip .fb input { flex: 1; min-width: 0; }
  button.on { border-color: var(--accent); color: var(--accent); }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 10px; }
  summary { cursor: pointer; font-weight: 600; }
  pre { white-space: pre-wrap; font: 12px/1.5 var(--mono); margin: 10px 0 0; max-height: 420px; overflow: auto; }
  .job, .rule, .folder { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
  .job .top, .rule .top, .folder .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .rule input.text { flex: 1; min-width: 220px; }
  .rule.conflict { border-color: var(--warn); }
  .bar2 { height: 6px; background: var(--chip); border-radius: 3px; width: 70px; overflow: hidden; } .bar2 i { display: block; height: 100%; background: var(--accent); }
  .grow { flex: 1; }
  .fv-wrap { position: relative; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
  .fv-wrap video { width: 100%; display: block; max-height: 46vh; background: #000; }
  .draw { position: absolute; inset: 0; cursor: crosshair; background: rgba(0,0,0,.35); touch-action: none; }
  .draw .hint { position: absolute; left: 0; right: 0; top: 8px; text-align: center; color: #fff; font-size: 12px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  .draw .box { position: absolute; border: 2px solid var(--accent); background: rgba(255,255,255,.12); box-shadow: 0 0 0 9999px rgba(0,0,0,.35); pointer-events: none; }
  .strip { position: relative; margin-bottom: 6px; cursor: crosshair; border-radius: 6px; overflow: hidden; background: var(--chip); }
  .strip img { width: 100%; display: block; }
  .strip .head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; }
  .tl { position: relative; height: 12px; background: var(--chip); border-radius: 6px; margin-bottom: 12px; overflow: hidden; }
  .tl i { position: absolute; top: 0; bottom: 0; background: var(--ok); opacity: .75; border-right: 1px solid var(--bg); }
  .tl i.proposed { background: var(--warn); }
  .checks { margin: 0 0 12px; padding: 0; list-style: none; font-size: 13px; }
  .checks li { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
  .checks .mk { width: 16px; text-align: center; font-weight: 700; color: var(--muted); } .checks .done .mk { color: var(--ok); }
  .mom { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
  .mom.proposed { border-color: var(--warn); }
  .mom .r { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .mom input.lab { flex: 1; min-width: 150px; } .mom label.inline input.num, label.inline input.num { width: 76px; }
  .checks li { align-items: flex-start; } .checks .mk { padding-top: 1px; } .checks label.inline { margin-top: 4px; }
  .mom details { border: 0; padding: 0; margin: 6px 0 0; background: transparent; } .mom details summary { font-weight: 500; font-size: 12px; color: var(--muted); }
  .badge.warn { color: var(--warn); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.on { opacity: 1; }
  a { color: inherit; }
  @media (max-width: 860px) { .split { grid-template-columns: 1fr; } .panel { position: static; max-height: none; } header { gap: 10px; } main { padding: 16px; } input[type=search] { min-width: 0; width: 100%; } .sync { margin-left: 0; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>reelcut <span>studio</span></h1>
  <nav aria-label="Sections">
    <a href="#library" data-tab="library">Library<span class="n" id="n-library"></span></a>
    <a href="#footage" data-tab="footage">Footage<span class="n" id="n-footage"></span></a>
    <a href="#review" data-tab="review">Review<span class="n" id="n-review"></span></a>
    <a href="#folders" data-tab="folders">Folders<span class="n" id="n-folders"></span></a>
    <a href="#learnings" data-tab="learnings">Learnings<span class="n" id="n-learnings"></span></a>
    <a href="#reels" data-tab="reels">Reels<span class="n" id="n-reels"></span></a>
    <a href="#jobs" data-tab="jobs">Jobs<span class="n" id="n-jobs"></span></a>
  </nav>
  <div class="sync" aria-live="polite"><span class="dot" id="dot"></span><span id="sync-text">Indexing</span><button id="pause" title="Pause or resume reading watched folders">Pause</button></div>
</header>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>
<script>
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const IMG = new Set(["png", "jpg", "jpeg", "gif", "webp", "avif", "svg"]);
const VID = new Set(["mp4", "webm", "mov"]);
const AUD = new Set(["mp3", "wav", "ogg", "m4a", "flac", "aiff"]);
const TYPES = [["", "All"], ["image", "Images"], ["vector", "Vectors"], ["video", "Video"], ["audio", "Sounds (SFX)"], ["document", "Documents"]];
const state = { tagFilter: new Set(), q: "", type: "", selected: null, assets: [], counts: { all: 0, pending: 0, queue: 0, audio: 0 }, tags: {}, runs: [], jobs: [], folders: [], ingest: null, picked: new Set(), uploads: [], dropKind: "generic", dropPrivate: false, learn: null, videos: [], fsel: null, ffmt: "1:1" };

async function api(path, init) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...init });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body ?? {}) });
const patch = (path, body) => api(path, { method: "PATCH", body: JSON.stringify(body) });
function toast(text) { const t = $("#toast"); t.textContent = text; t.classList.add("on"); clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("on"), 2400); }
function when(iso) { return iso ? new Date(iso).toLocaleString() : "—"; }
function dur(s) { return s == null ? "—" : s < 10 ? `${s.toFixed(2)} s` : `${Math.round(s)} s`; }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const fileUrl = (a) => `/files/asset/${a.id}`;
function preview(a, controls = false) {
  if (a.mediaType === "audio") return a.thumbUrl ? `<img src="${a.thumbUrl}" alt="waveform" loading="lazy">` : `<span class="ext">${esc(a.ext)}</span>`;
  if (IMG.has(a.ext)) return `<img src="${fileUrl(a)}" alt="" loading="lazy">`;
  if (VID.has(a.ext)) return controls ? `<video src="${fileUrl(a)}" controls preload="metadata"></video>` : a.thumbUrl ? `<img src="${a.thumbUrl}" alt="" loading="lazy">` : `<video src="${fileUrl(a)}" muted preload="metadata"></video>`;
  return a.thumbUrl ? `<img src="${a.thumbUrl}" alt="" loading="lazy">` : `<span class="ext">${esc(a.ext || "?")}</span>`;
}
function tagHtml(a, n = 99) { return a.tags.slice(0, n).map((t) => `<span class="tag ${(a.tagOrigin || {})[t] && a.tagOrigin[t] !== "user" ? "auto" : ""}" title="${(a.tagOrigin || {})[t] && a.tagOrigin[t] !== "user" ? "suggested by " + a.tagOrigin[t] + ", not yet reviewed" : "yours"}">#${esc(t)}</span>`).join(" "); }

// ---------- master status and pause
async function loadIngest() {
  try { state.ingest = await api("/api/ingest"); } catch { return; }
  const s = state.ingest.status, el = $("#dot");
  el.className = "dot " + (s.paused ? "off" : s.scanning ? "busy" : "");
  $("#sync-text").textContent = s.paused ? "Paused" : s.scanning ? `Indexing${s.pending ? ` · ${s.pending} left` : ""}` : "Idle";
  $("#pause").textContent = s.paused ? "Resume" : "Pause";
}
$("#pause").addEventListener("click", async () => {
  const paused = !state.ingest?.status.paused;
  try { await post("/api/ingest/pause", { paused }); toast(paused ? "Paused: watched folders are not being read" : "Resumed"); await loadIngest(); } catch (e) { toast(e.message); }
});
setInterval(loadIngest, 2500);

// ---------- library
async function loadLibrary() {
  const tags = [...state.tagFilter].join(",");
  const [a, t] = await Promise.all([api(`/api/assets?tags=${encodeURIComponent(tags)}&q=${encodeURIComponent(state.q)}&type=${state.type}`), api("/api/tags")]);
  state.assets = a.assets; state.counts = a.counts; state.tags = t.tags;
}
function dropZone() {
  return `<div class="drop" id="drop" role="group" aria-label="Upload assets">
    Drop files or whole folders here. They are checked, previewed and tagged on arrival, and wait in <a href="#review">Review</a> until you approve them.
    <div class="row">
      <button id="pick-files">Choose files</button><button id="pick-folder">Choose a folder</button>
      <label class="inline">Treat as <select id="drop-kind"><option value="generic" ${state.dropKind === "generic" ? "selected" : ""}>generic</option><option value="identity" ${state.dropKind === "identity" ? "selected" : ""}>identity (real brand marks or product screens)</option></select></label>
      <label class="inline"><input type="checkbox" id="drop-private" ${state.dropPrivate ? "checked" : ""}> Private (never shown to Claude)</label>
    </div>
    <input type="file" id="in-files" multiple hidden><input type="file" id="in-folder" webkitdirectory hidden>
  </div>
  <div class="uploads" id="uploads"></div>`;
}
function renderLibrary() {
  const tagEntries = Object.entries(state.tags).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 40);
  const sel = state.assets.find((a) => a.id === state.selected);
  $("#main").innerHTML = `
    ${dropZone()}
    <div class="bar">
      <input type="search" id="q" placeholder="Search name, tag, description or source…" aria-label="Search" value="${esc(state.q)}">
      ${TYPES.map(([v, l]) => `<span class="chip ${state.type === v ? "on" : ""}" data-type="${v}" role="button" tabindex="0">${l}${v === "audio" ? ` <span class="n">${state.counts.audio}</span>` : ""}</span>`).join("")}
    </div>
    <div class="bar">${tagEntries.map(([t, n]) => `<span class="chip ${state.tagFilter.has(t) ? "on" : ""}" data-tag="${esc(t)}" role="button" tabindex="0">#${esc(t)} <span class="n">${n}</span></span>`).join("")}</div>
    <div class="${sel ? "split" : ""}">
      <div>${state.assets.length === 0 ? emptyLibrary() : `<div class="grid">${state.assets.map(assetCard).join("")}</div>`}</div>
      ${sel ? assetPanel(sel) : ""}
    </div>`;
  bindDrop(); renderUploads();
  $("#q").addEventListener("input", debounce(async (e) => { state.q = e.target.value; await loadLibrary(); renderLibrary(); const q = $("#q"); q.focus(); q.setSelectionRange(state.q.length, state.q.length); }, 200));
  $$("[data-type]").forEach((el) => el.addEventListener("click", async () => { state.type = el.dataset.type; await loadLibrary(); renderLibrary(); }));
  $$("[data-tag]").forEach((el) => el.addEventListener("click", async () => { const t = el.dataset.tag; state.tagFilter.has(t) ? state.tagFilter.delete(t) : state.tagFilter.add(t); await loadLibrary(); renderLibrary(); }));
  $$("[data-asset]").forEach((el) => el.addEventListener("click", () => { state.selected = state.selected === el.dataset.asset ? null : el.dataset.asset; renderLibrary(); }));
  if (sel) bindPanel(sel);
}
function emptyLibrary() {
  if (state.tagFilter.size || state.q || state.type) return `<p class="empty">Nothing matches that filter.</p>`;
  return `<p class="empty">The library is empty. Drop files above, add a watched folder in <a href="#folders">Folders</a>, or run<br><br><code>npm run library -- add assets/in/claude-logo.svg --kind identity --tags claude,logo --url https://anthropic.com/brand</code></p>`;
}
function assetCard(a) {
  return `<div class="card ${a.id === state.selected ? "sel" : ""}" data-asset="${a.id}">
    <div class="thumb ${a.mediaType === "audio" ? "wave" : ""}">${preview(a)}</div>
    <div class="meta">
      <div class="name" title="${esc(a.name)}">${esc(a.name)}</div>
      <div class="sub"><span class="badge ${a.assetKind}">${a.assetKind}</span>${a.review.state !== "approved" ? `<span class="badge ${a.review.state}">${a.review.state}</span>` : ""}${a.queued ? `<span class="badge queued">needs Claude</span>` : ""}${a.status !== "active" ? `<span class="badge ${a.status}">${a.status}</span>` : ""}${tagHtml(a, 4)}</div>
    </div>
  </div>`;
}
function analysisRows(a) {
  const x = a.analysis || {}, rows = [];
  if (x.width) rows.push(["Size", `${x.width} × ${x.height}`]);
  if (x.durationSeconds != null) rows.push(["Length", dur(x.durationSeconds)]);
  if (x.peakDb != null) rows.push(["Level", `peak ${x.peakDb} dB · loudness ${x.lufs} · gain ${x.gainDb > 0 ? "+" : ""}${x.gainDb} dB when mixed`]);
  if (x.descriptors?.length) rows.push(["Shape", x.descriptors.join(", ")]);
  if (x.dominantColors?.length) rows.push(["Colours", `<span class="swatches">${x.dominantColors.map((c) => `<i style="background:${esc(c)}" title="${esc(c)}"></i>`).join("")}</span>`]);
  if (x.text) rows.push(["Text in file", esc(x.text)]);
  if (x.description) rows.push(["Claude says", esc(x.description)]);
  return rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
}
function assetPanel(a) {
  const p = a.provenance, ref = `assets/library/${a.file.split("/").pop()}`;
  return `<aside class="panel" aria-label="Asset details">
    <div class="preview thumb ${a.mediaType === "audio" ? "wave" : ""}">${preview(a, true)}</div>
    ${a.mediaType === "audio" ? `<audio controls preload="none" src="${fileUrl(a)}"></audio>` : ""}
    <h2>${esc(a.name)}</h2>
    <div class="ref"><code title="${ref}">${ref}</code><button id="copy">Copy</button></div>
    <dl>
      <dt>Kind</dt><dd>${a.assetKind}${a.mediaType !== "other" ? ` · ${a.mediaType}` : ""}</dd>

// ---------- upload
const MAX_PARALLEL = 3;
function bindDrop() {
  const drop = $("#drop"); if (!drop) return;
  const addAll = (items) => { state.dropKind = $("#drop-kind").value; state.dropPrivate = $("#drop-private").checked; enqueue(items); };
  $("#pick-files").addEventListener("click", () => $("#in-files").click());
  $("#pick-folder").addEventListener("click", () => $("#in-folder").click());
  $("#in-files").addEventListener("change", (e) => { addAll([...e.target.files].map((file) => ({ file, rel: "" }))); e.target.value = ""; });
  $("#in-folder").addEventListener("change", (e) => { addAll([...e.target.files].map((file) => ({ file, rel: (file.webkitRelativePath || "").split("/").slice(0, -1).join("/") }))); e.target.value = ""; });
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", async (e) => addAll(await filesFromDrop(e.dataTransfer)));
}
async function filesFromDrop(dt) {
  const out = [];
  const walk = async (entry, dir) => {
    if (entry.isFile) { out.push({ file: await new Promise((res, rej) => entry.file(res, rej)), rel: dir }); return; }
    if (!entry.isDirectory) return;
    const reader = entry.createReader(); let batch;
    do { batch = await new Promise((res, rej) => reader.readEntries(res, rej)); for (const child of batch) await walk(child, dir ? `${dir}/${entry.name}` : entry.name); } while (batch.length);
  };
  const entries = [...dt.items].map((i) => i.webkitGetAsEntry?.()).filter(Boolean);
  if (entries.length) for (const e of entries) await walk(e, "");
  else [...dt.files].forEach((file) => out.push({ file, rel: "" }));
  return out;
}
function enqueue(items) {
  const batch = items.filter((i) => !i.file.name.startsWith(".")).map((i) => ({ ...i, id: Math.random().toString(36).slice(2), progress: 0, status: "queued", note: "", kind: state.dropKind, private: state.dropPrivate }));
  if (!batch.length) return;
  state.uploads.push(...batch); renderUploads(); pump();
}
let running = 0;
function pump() {
  while (running < MAX_PARALLEL) {
    const next = state.uploads.find((u) => u.status === "queued"); if (!next) break;
    next.status = "sending"; running++; send(next).finally(() => { running--; renderUploads(); pump(); });
  }
  if (running === 0 && state.uploads.length && state.uploads.every((u) => u.status !== "queued" && u.status !== "sending")) finishUploads();
}
function send(u) {
  return new Promise((resolve) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload");
    xhr.setRequestHeader("x-reelcut-name", encodeURIComponent(u.file.name));
    if (u.rel) xhr.setRequestHeader("x-reelcut-path", encodeURIComponent(u.rel));
    xhr.setRequestHeader("x-reelcut-kind", u.kind);
    if (u.private) xhr.setRequestHeader("x-reelcut-private", "1");
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) { u.progress = e.loaded / e.total; renderUploads(); } };
    xhr.onload = () => {
      let body = {}; try { body = JSON.parse(xhr.responseText); } catch {}
      u.progress = 1;
      if (xhr.status === 201) { u.status = "done"; u.note = "added, waiting for review"; }
      else if (xhr.status === 200) { u.status = "done"; u.note = "already in the library"; }
      else { u.status = "failed"; u.note = body.outcome?.reason || body.error || `error ${xhr.status}`; }
      resolve();
    };
    xhr.onerror = () => { u.status = "failed"; u.note = "the studio could not be reached"; resolve(); };
    xhr.send(u.file);
  });
}
function renderUploads() {
  const el = $("#uploads"); if (!el) return;
  const list = state.uploads.slice(-40);
  el.innerHTML = list.map((u) => `<div class="u"><span title="${esc(u.rel ? u.rel + "/" : "")}${esc(u.file.name)}">${esc(u.file.name)}</span><progress max="1" value="${u.progress}"></progress><span class="${u.status === "failed" ? "badge failed" : "note"}">${esc(u.status === "sending" ? "uploading…" : u.note || u.status)}</span></div>`).join("");
}
async function finishUploads() {
  const done = state.uploads.filter((u) => u.status === "done").length, failed = state.uploads.filter((u) => u.status === "failed").length;
  toast(`${done} added${failed ? `, ${failed} failed` : ""}`);
  state.uploads = state.uploads.filter((u) => u.status === "failed");
  await loadLibrary(); if (location.hash.slice(1).split("/")[0] === "library" || !location.hash) renderLibrary();
  updateBadges();
}

// Drag a region on the video. The region keeps the recording's own proportions (the same fraction of its width and height), so what

      return patch(`/api/assets/${a.id}/moments/${id}`, { focus: { ...(m.focus || {}), [fmt]: r } });
    }, "Region saved");
    act("unfocus", () => { const next = { ...(m.focus || {}) }; delete next[fmt]; return patch(`/api/assets/${a.id}/moments/${id}`, { focus: next }); }, "Region cleared");
  });
}

// ---------- shell
let poll;
async function updateBadges() {
  try {
    const [lib, folders, learn] = await Promise.all([api("/api/assets?limit=0"), api("/api/folders"), api("/api/learnings")]);
    state.counts = lib.counts; state.folders = folders.folders; state.learn = learn;
  } catch { return; }
  $("#n-library").textContent = state.counts.all || "";
  $("#n-review").textContent = state.counts.pending || "";
  $("#n-footage").textContent = state.counts.footage || "";
  $("#n-folders").textContent = state.folders.length || "";
  const waiting = (state.learn?.rules || []).filter((r) => r.status === "proposed" && !r.conflictWith.length).length;
  $("#n-learnings").textContent = waiting || "";
  $("#n-reels").textContent = state.runs.length || "";
  $("#n-jobs").textContent = state.jobs.filter((j) => j.status === "running").length ? "●" : "";
}
async function route() {
  const [tab, id] = (location.hash.slice(1) || "library").split("/");
  $$("nav a").forEach((a) => a.classList.toggle("on", a.dataset.tab === tab));
  clearTimeout(poll);
  try {
    await Promise.all([loadRuns(), loadJobs(), loadIngest()]);
    await updateBadges();
    if (tab === "reels" && id) await renderReel(id);
    else if (tab === "reels") renderReels();
    else if (tab === "jobs") renderJobs();
    else if (tab === "footage") await renderFootage();
    else if (tab === "review") await renderReview();
    else if (tab === "folders") await renderFolders();
    else if (tab === "learnings") await renderLearnings();
    else { await loadLibrary(); renderLibrary(); }
  } catch (e) { $("#main").innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
  if (tab === "jobs" && state.jobs.some((j) => j.status === "running")) poll = setTimeout(route, 2000);
}
window.addEventListener("hashchange", route);
route();
</script>
